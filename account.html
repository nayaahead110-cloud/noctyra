<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>حسابي — Noctyra</title><style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 20%, #24172f 0%, #0b0a0e 42%, #060608 100%);
  color: #eee;
  font-family: Arial, sans-serif;
  padding: 30px 20px;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

.logo {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 8px;
  margin-bottom: 30px;
}

.logo span {
  color: #9b72bd;
}

.card {
  background: rgba(15, 14, 19, .97);
  border: 1px solid #29242f;
  border-radius: 12px;
  padding: 35px 28px;
  box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

.avatar-area {
  text-align: center;
  margin-bottom: 25px;
}

.avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;

  background:
    radial-gradient(circle, #32223e, #100d14);

  border: 2px solid #76548f;

  display: block;
  margin: auto;

  box-shadow:
    0 0 30px rgba(125, 82, 160, .18);
}

.avatar-button {
  display: inline-block;
  margin-top: 14px;

  color: #b18bc8;
  font-size: 13px;

  cursor: pointer;
}

.avatar-button:hover {
  color: white;
}

input[type="file"] {
  display: none;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #77727d;
  font-size: 13px;
  margin-bottom: 30px;
}

.field {
  margin-bottom: 20px;
}

label {
  display: block;
  color: #bdb8c2;
  font-size: 13px;
  margin-bottom: 8px;
}

.email {
  width: 100%;
  padding: 14px;

  background: #09090c;
  border: 1px solid #2b2730;
  border-radius: 6px;

  color: #77727d;
  font-size: 14px;

  word-break: break-word;
}

textarea {
  width: 100%;
  min-height: 110px;

  resize: vertical;

  background: #09090c;
  color: white;

  border: 1px solid #2b2730;
  border-radius: 6px;

  padding: 14px;

  outline: none;

  font-family: Arial, sans-serif;
  font-size: 14px;
}

textarea:focus {
  border-color: #805da0;
}

button {
  width: 100%;
  padding: 14px;

  background: #eee;
  color: #09090c;

  border: 1px solid #eee;
  border-radius: 6px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  background: transparent;
  color: #eee;
}

.logout {
  margin-top: 10px;

  background: transparent;
  color: #b18bc8;
  border-color: #393340;
}

.message {
  min-height: 20px;

  text-align: center;

  color: #b18bc8;

  font-size: 13px;

  margin-top: 18px;
}

.back {
  display: block;

  text-align: center;

  color: #66616b;

  text-decoration: none;

  font-size: 12px;

  margin-top: 25px;
}

.private-note {
  text-align: center;
  color: #55515b;
  font-size: 11px;
  margin-top: 10px;
}

</style></head><body><main class="container">  <div class="logo">
    NOCTYRA<span>.</span>
  </div>  <section class="card"><div class="avatar-area">

  <img
    id="avatar"
    class="avatar"
    alt="الصورة الشخصية"
  >

  <label
    for="avatarInput"
    class="avatar-button"
  >
    تغيير الصورة
  </label>

  <input
    id="avatarInput"
    type="file"
    accept="image/*"
  >

</div>


<h1>
  حسابي
</h1>

<p class="subtitle">
  ملفك الشخصي في Noctyra
</p>


<div class="field">

  <label>
    البريد الإلكتروني
  </label>

  <div
    class="email"
    id="email"
  >
    جاري التحميل...
  </div>

  <div class="private-note">
    بريدك الإلكتروني خاص ولا يظهر للأعضاء.
  </div>

</div>


<div class="field">

  <label for="bio">
    نبذة عني
  </label>

  <textarea
    id="bio"
    maxlength="250"
    placeholder="اكتب نبذة قصيرة عنك..."
  ></textarea>

</div>


<button id="saveButton">
  حفظ التغييرات
</button>


<button
  id="logoutButton"
  class="logout"
>
  تسجيل الخروج
</button>


<div
  id="message"
  class="message"
></div>


<a
  href="index.html"
  class="back"
>
  ← العودة إلى الرئيسية
</a>

  </section></main><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

  authDomain:
    "noctyra-4b71b.firebaseapp.com",

  projectId:
    "noctyra-4b71b",

  storageBucket:
    "noctyra-4b71b.firebasestorage.app",

  messagingSenderId:
    "240877556023",

  appId:
    "1:240877556023:web:99529c91607902b8414ab2",

  measurementId:
    "G-DYP839YDNK"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


const avatar =
  document.getElementById("avatar");

const avatarInput =
  document.getElementById("avatarInput");

const email =
  document.getElementById("email");

const bio =
  document.getElementById("bio");

const saveButton =
  document.getElementById("saveButton");

const logoutButton =
  document.getElementById("logoutButton");

const message =
  document.getElementById("message");


let currentUser = null;


/* صورة افتراضية */

const defaultAvatar =
  "data:image/svg+xml;charset=UTF-8," +
  encodeURIComponent(`
    <svg xmlns="http://www.w3.org/2000/svg"
         width="200"
         height="200"
         viewBox="0 0 200 200">

      <rect width="200"
            height="200"
            fill="#100d14"/>

      <circle cx="100"
              cy="80"
              r="35"
              fill="#76548f"/>

      <path
        d="M45 175
           C50 130 75 115 100 115
           C125 115 150 130 155 175"
        fill="#76548f"/>

    </svg>
  `);

avatar.src = defaultAvatar;


/* التأكد من تسجيل الدخول */

onAuthStateChanged(
  auth,
  (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }

    currentUser = user;

    email.textContent =
      user.email;

    const savedBio =
      localStorage.getItem(
        "noctyra_bio_" + user.uid
      );

    const savedAvatar =
      localStorage.getItem(
        "noctyra_avatar_" + user.uid
      );

    if (savedBio) {
      bio.value = savedBio;
    }

    if (savedAvatar) {
      avatar.src = savedAvatar;
    }

  }
);


/* تغيير الصورة */

avatarInput.addEventListener(
  "change",
  () => {

    const file =
      avatarInput.files[0];

    if (!file) return;


    if (!file.type.startsWith("image/")) {

      message.textContent =
        "اختاري صورة فقط.";

      return;

    }


    if (file.size > 2 * 1024 * 1024) {

      message.textContent =
        "حجم الصورة يجب أن يكون أقل من 2MB.";

      return;

    }


    const reader =
      new FileReader();


    reader.onload = () => {

      avatar.src =
        reader.result;

      message.textContent =
        "تم اختيار الصورة.";

    };


    reader.readAsDataURL(file);

  }
);


/* حفظ البيانات */

saveButton.addEventListener(
  "click",
  () => {

    if (!currentUser) return;


    localStorage.setItem(
      "noctyra_bio_" + currentUser.uid,
      bio.value.trim()
    );


    const image =
      avatar.src;


    if (image.startsWith("data:image")) {

      localStorage.setItem(
        "noctyra_avatar_" + currentUser.uid,
        image
      );

    }


    message.textContent =
      "تم حفظ التغييرات ✓";

  }
);


/* تسجيل الخروج */

logoutButton.addEventListener(
  "click",
  async () => {

    await signOut(auth);

    window.location.href =
      "login.html";

  }
);

</script></body>
</html>
