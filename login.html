<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول — Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 35%,
          #21172c 0%,
          #0b0a0e 45%,
          #060608 100%
        );
      color: #eee;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 8px;
    }

    .logo span {
      color: #9b72bd;
    }

    .line {
      width: 45px;
      height: 1px;
      background: #76548f;
      margin: 14px auto 0;
    }

    .login-box {
      background: rgba(15, 14, 19, 0.96);
      border: 1px solid #29242f;
      border-radius: 10px;
      padding: 40px 30px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .5);
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #77727d;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: #bdb8c2;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      background: #09090c;
      color: white;
      border: 1px solid #2b2730;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #805da0;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #eee;
      color: #09090c;
      border: 1px solid #eee;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: transparent;
      color: #eee;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .switch {
      margin-top: 12px;
      background: transparent;
      color: #b18bc8;
      border: 1px solid #393340;
    }

    .switch:hover {
      background: #b18bc8;
      color: #09090c;
      border-color: #b18bc8;
    }

    .message {
      min-height: 20px;
      margin-top: 18px;
      text-align: center;
      color: #b18bc8;
      font-size: 13px;
    }

    .back {
      display: block;
      text-align: center;
      color: #66616b;
      text-decoration: none;
      font-size: 12px;
      margin-top: 25px;
      transition: 0.2s;
    }

    .back:hover {
      color: #b18bc8;
    }


    /* =========================
       Avatar
    ========================= */

    .avatar-section {
      display: none;
      text-align: center;
      margin-bottom: 25px;
    }

    .avatar-preview {
      width: 105px;
      height: 105px;
      margin: 0 auto 12px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #29153d,
          #100a16
        );

      border: 2px solid #704095;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: #b18bc8;
      font-size: 38px;

      box-shadow:
        0 0 25px rgba(155, 114, 189, .12);
    }

    .avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .avatar-label {
      display: inline-block;

      padding: 9px 18px;

      background: rgba(112, 64, 149, .15);

      border: 1px solid #704095;

      border-radius: 8px;

      color: #caa9df;

      font-size: 13px;

      cursor: pointer;

      transition: .2s;
    }

    .avatar-label:hover {
      background: rgba(112, 64, 149, .28);
    }

    #avatarInput {
      display: none;
    }

    .avatar-note {
      color: #625b68;
      font-size: 11px;
      margin-top: 8px;
    }


    @media (max-width: 500px) {

      .login-box {
        padding: 35px 22px;
      }

      .logo {
        font-size: 26px;
        letter-spacing: 6px;
      }

    }

  </style>
</head>


<body>

  <main class="login-container">


    <div class="brand">

      <div class="logo">
        NOCTYRA<span>.</span>
      </div>

      <div class="line"></div>

    </div>


    <section class="login-box">


      <h1 id="title">
        تسجيل الدخول
      </h1>


      <p class="subtitle" id="subtitle">
        ادخل إلى عالم Noctyra
      </p>


      <form id="authForm">


        <!-- =========================
             Avatar
        ========================= -->

        <div
          class="avatar-section"
          id="avatarSection"
        >

          <div class="avatar-preview">

            <span id="avatarLetter">
              N
            </span>

            <img
              id="avatarPreview"
              alt="Avatar"
            >

          </div>


          <label
            for="avatarInput"
            class="avatar-label"
          >
            اختيار الأفاتار
          </label>


          <input
            id="avatarInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
          >


          <div class="avatar-note">
            PNG أو JPG أو WEBP
          </div>

        </div>



        <!-- =========================
             Username
        ========================= -->

        <div
          class="form-group"
          id="usernameGroup"
          style="display:none;"
        >

          <label for="username">
            اسم المستخدم
          </label>

          <input
            id="username"
            type="text"
            placeholder="username"
            minlength="3"
            maxlength="20"
            pattern="[A-Za-z0-9_]+"
            autocomplete="username"
          >

        </div>



        <!-- =========================
             Email
        ========================= -->

        <div class="form-group">

          <label for="email">
            البريد الإلكتروني
          </label>

          <input
            id="email"
            type="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
          >

        </div>



        <!-- =========================
             Password
        ========================= -->

        <div class="form-group">

          <label for="password">
            كلمة المرور
          </label>

          <input
            id="password"
            type="password"
            placeholder="••••••••"
            minlength="6"
            autocomplete="current-password"
            required
          >

        </div>



        <!-- =========================
             Confirm Password
        ========================= -->

        <div
          class="form-group"
          id="confirmGroup"
          style="display:none;"
        >

          <label for="confirmPassword">
            تأكيد كلمة المرور
          </label>

          <input
            id="confirmPassword"
            type="password"
            placeholder="••••••••"
            autocomplete="new-password"
          >

        </div>



        <button
          type="submit"
          id="submitButton"
        >
          تسجيل الدخول
        </button>



        <button
          type="button"
          class="switch"
          id="switchButton"
        >
          إنشاء حساب جديد
        </button>


      </form>



      <div
        class="message"
        id="message"
      ></div>



      <a
        href="index.html"
        class="back"
      >
        ← العودة إلى الرئيسية
      </a>


    </section>

  </main>



  <script type="module">


    /* =========================
       Firebase App
    ========================= */

    import {
      initializeApp
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";



    /* =========================
       Firebase Auth
    ========================= */

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



    /* =========================
       Firestore
    ========================= */

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      serverTimestamp
    }
    from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



    /* =========================
       Firebase Config
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

      authDomain:
        "noctyra-4b71b.firebaseapp.com",

      projectId:
        "noctyra-4b71b",

      storageBucket:
        "noctyra-4b71b.firebasestorage.app",

      messagingSenderId:
        "240877556023",

      appId:
        "1:240877556023:web:99529c91607902b8414ab2",

      measurementId:
        "G-DYP839YDNK"

    };



    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);



    /* =========================
       حفظ جلسة الدخول
    ========================= */

    const persistenceReady =
      setPersistence(
        auth,
        browserLocalPersistence
      );



    /* =========================
       العناصر
    ========================= */

    const form =
      document.getElementById("authForm");


    const username =
      document.getElementById("username");


    const usernameGroup =
      document.getElementById("usernameGroup");


    const email =
      document.getElementById("email");


    const password =
      document.getElementById("password");


    const confirmPassword =
      document.getElementById("confirmPassword");


    const confirmGroup =
      document.getElementById("confirmGroup");


    const submitButton =
      document.getElementById("submitButton");


    const switchButton =
      document.getElementById("switchButton");


    const title =
      document.getElementById("title");


    const subtitle =
      document.getElementById("subtitle");


    const message =
      document.getElementById("message");


    const avatarSection =
      document.getElementById("avatarSection");


    const avatarInput =
      document.getElementById("avatarInput");


    const avatarPreview =
      document.getElementById("avatarPreview");


    const avatarLetter =
      document.getElementById("avatarLetter");



    /* =========================
       الوضع الحالي
    ========================= */

    let registerMode = false;


    let avatarData = "";



    /* =========================
       تحويل الصورة إلى حجم صغير
    ========================= */

    function compressAvatar(file) {

      return new Promise((resolve, reject) => {

        const reader =
          new FileReader();


        reader.onload = (event) => {

          const img =
            new Image();


          img.onload = () => {

            const canvas =
              document.createElement("canvas");


            const maxSize = 400;


            let width =
              img.width;


            let height =
              img.height;


            if (width > height) {

              if (width > maxSize) {

                height =
                  Math.round(
                    height *
                    maxSize /
                    width
                  );

                width =
                  maxSize;

              }

            }

            else {

              if (height > maxSize) {

                width =
                  Math.round(
                    width *
                    maxSize /
                    height
                  );

                height =
                  maxSize;

              }

            }


            canvas.width =
              width;


            canvas.height =
              height;


            const ctx =
              canvas.getContext("2d");


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            const result =
              canvas.toDataURL(
                "image/jpeg",
                0.75
              );


            resolve(result);

          };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


        reader.onerror =
          reject;


        reader.readAsDataURL(file);

      });

    }



    /* =========================
       اختيار الأفاتار
    ========================= */

    avatarInput.addEventListener(
      "change",
      async () => {

        const file =
          avatarInput.files[0];


        if (!file) {

          return;

        }


        if (
          !file.type.startsWith("image/")
        ) {

          message.textContent =
            "اختاري ملف صورة فقط.";

          avatarInput.value =
            "";

          return;

        }


        try {

          message.textContent =
            "جاري تجهيز الأفاتار...";


          avatarData =
            await compressAvatar(file);


          avatarPreview.src =
            avatarData;


          avatarPreview.style.display =
            "block";


          avatarLetter.style.display =
            "none";


          message.textContent =
            "";

        }

        catch (error) {

          console.error(error);

          message.textContent =
            "تعذر تحميل الصورة.";

          avatarData =
            "";

        }

      }
    );



    /* =========================
       تبديل تسجيل / إنشاء
    ========================= */

    switchButton.addEventListener(
      "click",
      () => {

        registerMode =
          !registerMode;


        message.textContent =
          "";


        if (registerMode) {

          title.textContent =
            "إنشاء حساب";


          subtitle.textContent =
            "أنشئ حسابك في Noctyra";


          submitButton.textContent =
            "إنشاء الحساب";


          switchButton.textContent =
            "لدي حساب بالفعل";


          usernameGroup.style.display =
            "block";


          username.required =
            true;


          confirmGroup.style.display =
            "block";


          confirmPassword.required =
            true;


          avatarSection.style.display =
            "block";


          password.autocomplete =
            "new-password";

        }

        else {

          title.textContent =
            "تسجيل الدخول";


          subtitle.textContent =
            "ادخل إلى عالم Noctyra";


          submitButton.textContent =
            "تسجيل الدخول";


          switchButton.textContent =
            "إنشاء حساب جديد";


          usernameGroup.style.display =
            "none";


          username.required =
            false;


          username.value =
            "";


          confirmGroup.style.display =
            "none";


          confirmPassword.required =
            false;


          confirmPassword.value =
            "";


          avatarSection.style.display =
            "none";


          avatarInput.value =
            "";


          avatarData =
            "";


          avatarPreview.src =
            "";


          avatarPreview.style.display =
            "none";


          avatarLetter.style.display =
            "block";


          password.autocomplete =
            "current-password";

        }

      }
    );



    /* =========================
       إرسال النموذج
    ========================= */

    form.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        message.textContent =
          "";


        const emailValue =
          email.value.trim();


        const passwordValue =
          password.value;


        const usernameValue =
          username.value.trim();


        submitButton.disabled =
          true;



        try {

          await persistenceReady;



          /* =========================
             إنشاء حساب جديد
          ========================= */

          if (registerMode) {


            /* التحقق من اليوزر */

            if (
              !/^[A-Za-z0-9_]{3,20}$/.test(
                usernameValue
              )
            ) {

              message.textContent =
                "اليوزر لازم يكون 3 إلى 20 حرف، وبالإنجليزي فقط.";

              submitButton.disabled =
                false;

              return;

            }



            /* تأكيد كلمة المرور */

            if (
              passwordValue !==
              confirmPassword.value
            ) {

              message.textContent =
                "كلمتا المرور غير متطابقتين.";

              submitButton.disabled =
                false;

              return;

            }



            /* =========================
               التحقق من توفر اليوزر
            ========================= */

            const usernameRef =
              doc(
                db,
                "usernames",
                usernameValue.toLowerCase()
              );


            const usernameSnapshot =
              await getDoc(usernameRef);


            if (usernameSnapshot.exists()) {

              message.textContent =
                "هذا اليوزر مستخدم بالفعل.";

              submitButton.disabled =
                false;

              return;

            }



            /* =========================
               إنشاء حساب Firebase
            ========================= */

            const userCredential =
              await createUserWithEmailAndPassword(
                auth,
                emailValue,
                passwordValue
              );


            const user =
              userCredential.user;



            /* =========================
               حفظ بيانات العضو
            ========================= */

            await setDoc(
              doc(
                db,
                "users",
                user.uid
              ),
              {

                uid:
                  user.uid,

                username:
                  usernameValue,

                email:
                  user.email,

                avatar:
                  avatarData || "",

                createdAt:
                  serverTimestamp()

              }
            );



            /* =========================
               حجز اليوزر
            ========================= */

            await setDoc(
              usernameRef,
              {

                uid:
                  user.uid,

                username:
                  usernameValue

              }
            );



            message.textContent =
              "تم إنشاء حسابك بنجاح ✓";



            setTimeout(
              () => {

                window.location.href =
                  "index.html";

              },
              1000
            );

          }



          /* =========================
             تسجيل الدخول
          ========================= */

          else {

            await signInWithEmailAndPassword(
              auth,
              emailValue,
              passwordValue
            );


            message.textContent =
              "تم تسجيل الدخول بنجاح ✓";


            setTimeout(
              () => {

                window.location.href =
                  "index.html";

              },
              1000
            );

          }

        }



        catch (error) {

          console.error(
            "Firebase Error:",
            error
          );


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            message.textContent =
              "هذا البريد مستخدم بالفعل.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message.textContent =
              "البريد الإلكتروني غير صحيح.";

          }

          else if (
            error.code ===
            "auth/weak-password"
          ) {

            message.textContent =
              "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

          }

          else if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message.textContent =
              "البريد أو كلمة المرور غير صحيحة.";

          }

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message.textContent =
              "محاولات كثيرة. حاولي مرة أخرى لاحقًا.";

          }

          else if (
            error.code ===
            "permission-denied"
          ) {

            message.textContent =
              "لا توجد صلاحية لحفظ بيانات الحساب.";

          }

          else {

            message.textContent =
              "حدث خطأ، حاولي مرة أخرى.";

          }


          submitButton.disabled =
            false;

        }

      }
    );

  </script>

</body>

</html>
