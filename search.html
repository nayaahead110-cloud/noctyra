<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noctyra | البحث</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #09090c;
      color: #eee;
      min-height: 100vh;
      transition: .3s;
    }

    body.light {
      background: #f4f3f7;
      color: #18151d;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(9,9,12,.94);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    body.light header {
      background: rgba(244,243,247,.94);
      border-color: rgba(0,0,0,.08);
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #fff;
    }

    body.light .logo {
      color: #17131d;
    }

    .logo span {
      color: #9b72bd;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255,255,255,.08);
      background: #101015;
      color: #ddd;
      border-radius: 12px;
      cursor: pointer;
      transition: .2s;
    }

    .icon-btn:hover {
      border-color: #8d6bb5;
      color: #b58bdd;
    }

    body.light .icon-btn {
      background: #fff;
      color: #333;
      border-color: rgba(0,0,0,.08);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1100px, 92%);
      margin: 0 auto;
      padding: 55px 0 80px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title h1 {
      font-size: 32px;
      margin-bottom: 9px;
    }

    .page-title p {
      color: #888;
      font-size: 14px;
    }

    body.light .page-title p {
      color: #777;
    }

    /* =========================
       SEARCH BOX
    ========================= */

    .search-box {
      max-width: 800px;
      margin: 0 auto 45px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 58px;
      padding: 0 58px 0 20px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.09);
      background: #101015;
      color: #fff;
      outline: none;
      font-size: 16px;
      transition: .2s;
    }

    .search-box input:focus {
      border-color: #8d6bb5;
      box-shadow: 0 0 0 3px rgba(141,107,181,.10);
    }

    .search-box input::placeholder {
      color: #666;
    }

    body.light .search-box input {
      background: #fff;
      color: #222;
      border-color: rgba(0,0,0,.09);
    }

    .search-icon {
      position: absolute;
      right: 19px;
      top: 50%;
      transform: translateY(-50%);
      color: #9b72bd;
      font-size: 21px;
      pointer-events: none;
    }

    /* =========================
       SECTIONS
    ========================= */

    .results-section {
      margin-bottom: 42px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .section-head h2 {
      font-size: 19px;
    }

    .count {
      color: #777;
      font-size: 13px;
    }

    /* =========================
       WORKS
    ========================= */

    .works-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .work-card {
      background: #101015;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
      overflow: hidden;
      transition: .25s;
    }

    .work-card:hover {
      transform: translateY(-4px);
      border-color: rgba(141,107,181,.55);
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }

    body.light .work-card {
      background: #fff;
      border-color: rgba(0,0,0,.07);
    }

    .work-cover {
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #17171d;
      overflow: hidden;
    }

    .work-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .work-info {
      padding: 13px;
    }

    .work-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .work-type {
      margin-top: 6px;
      color: #8d6bb5;
      font-size: 12px;
    }

    /* =========================
       ACCOUNTS
    ========================= */

    .accounts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 13px;
    }

    .account-card {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 15px;
      background: #101015;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
      transition: .2s;
    }

    .account-card:hover {
      border-color: rgba(141,107,181,.55);
      transform: translateY(-2px);
    }

    body.light .account-card {
      background: #fff;
      border-color: rgba(0,0,0,.07);
    }

    .avatar {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      overflow: hidden;
      background: #1b1820;
      border: 1px solid rgba(141,107,181,.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a982c7;
      font-size: 19px;
      font-weight: bold;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-info {
      min-width: 0;
    }

    .display-name {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .username {
      color: #9871b7;
      font-size: 13px;
      direction: ltr;
      text-align: right;
      unicode-bidi: plaintext;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       STATES
    ========================= */

    .empty {
      text-align: center;
      padding: 45px 20px;
      background: #101015;
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 16px;
      color: #777;
    }

    body.light .empty {
      background: #fff;
      border-color: rgba(0,0,0,.07);
    }

    .empty-icon {
      font-size: 35px;
      margin-bottom: 12px;
      opacity: .65;
    }

    .empty-title {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 6px;
    }

    body.light .empty-title {
      color: #555;
    }

    .empty-text {
      font-size: 13px;
    }

    .loading {
      text-align: center;
      color: #888;
      padding: 35px;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       BACK BUTTON
    ========================= */

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #999;
      font-size: 14px;
      margin-bottom: 25px;
      transition: .2s;
    }

    .back-btn:hover {
      color: #b58bdd;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      header {
        padding: 0 4%;
        height: 64px;
      }

      .logo {
        font-size: 20px;
      }

      main {
        width: 92%;
        padding-top: 38px;
      }

      .page-title h1 {
        font-size: 27px;
      }

      .works-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .accounts-list {
        grid-template-columns: 1fr;
      }

      .work-info {
        padding: 10px;
      }

      .work-title {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html" class="logo">
      N<span>o</span>ctyra
    </a>

    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="تغيير المظهر">☾</button>
    </div>
  </header>


  <main>

    <a href="index.html" class="back-btn">
      ← العودة للرئيسية
    </a>

    <div class="page-title">
      <h1>البحث</h1>
      <p>ابحث عن الأعمال والحسابات في Noctyra</p>
    </div>


    <div class="search-box">
      <span class="search-icon">⌕</span>

      <input
        type="search"
        id="searchInput"
        placeholder="ابحث عن عمل أو اسم مستخدم..."
        autocomplete="off"
      >
    </div>


    <!-- =========================
         WORKS
    ========================= -->

    <section class="results-section" id="worksSection">

      <div class="section-head">
        <h2>📚 الأعمال</h2>
        <span class="count" id="worksCount"></span>
      </div>

      <div id="worksResults" class="works-grid"></div>

      <div id="worksEmpty" class="empty hidden">
        <div class="empty-icon">📚</div>
        <div class="empty-title">ما لقينا أعمال</div>
        <div class="empty-text">
          جربي اسم مختلف أو كلمة ثانية.
        </div>
      </div>

    </section>


    <!-- =========================
         ACCOUNTS
    ========================= -->

    <section class="results-section" id="accountsSection">

      <div class="section-head">
        <h2>👤 الحسابات</h2>
        <span class="count" id="accountsCount"></span>
      </div>

      <div id="accountsResults" class="accounts-list"></div>

      <div id="accountsEmpty" class="empty hidden">
        <div class="empty-icon">👤</div>
        <div class="empty-title">ما لقينا حسابات</div>
        <div class="empty-text">
          تأكدي من اسم المستخدم أو جربي كلمة ثانية.
        </div>
      </div>

    </section>


    <div id="initialMessage" class="empty">
      <div class="empty-icon">⌕</div>
      <div class="empty-title">ابدئي بالبحث</div>
      <div class="empty-text">
        اكتبي اسم عمل أو اسم مستخدم للعثور على النتائج.
      </div>
    </div>

    <div id="loading" class="loading hidden">
      جاري تحميل البيانات...
    </div>

  </main>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getFirestore,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",
      authDomain: "noctyra-4b71b.firebaseapp.com",
      projectId: "noctyra-4b71b",
      storageBucket: "noctyra-4b71b.firebasestorage.app",
      messagingSenderId: "240877556023",
      appId: "1:240877556023:web:99529c91607902b8414ab2",
      measurementId: "G-DYP839YDNK"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    /* =========================
       ELEMENTS
    ========================= */

    const searchInput = document.getElementById("searchInput");

    const worksResults = document.getElementById("worksResults");
    const accountsResults = document.getElementById("accountsResults");

    const worksEmpty = document.getElementById("worksEmpty");
    const accountsEmpty = document.getElementById("accountsEmpty");

    const worksCount = document.getElementById("worksCount");
    const accountsCount = document.getElementById("accountsCount");

    const worksSection = document.getElementById("worksSection");
    const accountsSection = document.getElementById("accountsSection");

    const initialMessage = document.getElementById("initialMessage");
    const loading = document.getElementById("loading");


    let works = [];
    let accounts = [];


    /* =========================
       LOAD DATA
    ========================= */

    async function loadData() {

      loading.classList.remove("hidden");
      initialMessage.classList.add("hidden");

      try {

        const worksSnapshot = await getDocs(
          collection(db, "works")
        );

        works = worksSnapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));


        const accountsSnapshot = await getDocs(
          collection(db, "publicProfiles")
        );

        accounts = accountsSnapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));

      } catch (error) {

        console.error("خطأ في تحميل البيانات:", error);

        works = [];
        accounts = [];

      } finally {

        loading.classList.add("hidden");
        initialMessage.classList.remove("hidden");

      }
    }


    /* =========================
       NORMALIZE SEARCH
    ========================= */

    function normalize(value) {

      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/^@/, "");

    }


    /* =========================
       WORK TITLE
    ========================= */

    function getWorkTitle(work) {

      return (
        work.title ||
        work.name ||
        work.originalTitle ||
        "عمل بدون اسم"
      );

    }


    /* =========================
       WORK IMAGE
    ========================= */

    function getWorkImage(work) {

      return (
        work.cover ||
        work.coverUrl ||
        work.image ||
        work.imageUrl ||
        work.thumbnail ||
        ""
      );

    }


    /* =========================
       ACCOUNT AVATAR
    ========================= */

    function getAvatar(account) {

      return (
        account.avatar ||
        account.avatarUrl ||
        account.photoURL ||
        account.photoUrl ||
        ""
      );

    }


    /* =========================
       ACCOUNT NAME
    ========================= */

    function getDisplayName(account) {

      return (
        account.displayName ||
        account.name ||
        account.username ||
        "مستخدم"
      );

    }


    function getUsername(account) {

      const username =
        account.username ||
        "";

      if (!username) {
        return "";
      }

      return username.startsWith("@")
        ? username
        : "@" + username;
    }


    /* =========================
       ESCAPE HTML
    ========================= */

    function escapeHTML(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       SEARCH WORKS
    ========================= */

    function searchWorks(query) {

      if (!query) {
        return [];
      }

      return works.filter(work => {

        const title = normalize(work.title);
        const name = normalize(work.name);
        const originalTitle = normalize(work.originalTitle);
        const alternativeTitle = normalize(work.alternativeTitle);
        const altTitle = normalize(work.altTitle);

        return (
          title.includes(query) ||
          name.includes(query) ||
          originalTitle.includes(query) ||
          alternativeTitle.includes(query) ||
          altTitle.includes(query)
        );

      });

    }


    /* =========================
       SEARCH ACCOUNTS
    ========================= */

    function searchAccounts(query) {

      if (!query) {
        return [];
      }

      return accounts.filter(account => {

        const username = normalize(account.username);
        const displayName = normalize(account.displayName);
        const name = normalize(account.name);

        return (
          username.includes(query) ||
          displayName.includes(query) ||
          name.includes(query)
        );

      });

    }


    /* =========================
       RENDER WORKS
    ========================= */

    function renderWorks(results) {

      worksResults.innerHTML = "";

      worksCount.textContent =
        results.length
          ? `${results.length} نتيجة`
          : "";

      if (!results.length) {

        worksEmpty.classList.remove("hidden");
        return;

      }

      worksEmpty.classList.add("hidden");

      results.forEach(work => {

        const title = getWorkTitle(work);
        const image = getWorkImage(work);

        const card = document.createElement("a");

        card.className = "work-card";

        card.href =
          `work.html?id=${encodeURIComponent(work.id)}`;

        const cover = image
          ? `<img src="${escapeHTML(image)}" alt="${escapeHTML(title)}" loading="lazy">`
          : `<div style="
                width:100%;
                height:100%;
                display:flex;
                align-items:center;
                justify-content:center;
                color:#777;
                font-size:35px;
              ">📖</div>`;

        const type =
          work.type ||
          work.category ||
          "عمل";

        card.innerHTML = `
          <div class="work-cover">
            ${cover}
          </div>

          <div class="work-info">

            <div class="work-title">
              ${escapeHTML(title)}
            </div>

            <div class="work-type">
              ${escapeHTML(type)}
            </div>

          </div>
        `;

        worksResults.appendChild(card);

      });

    }


    /* =========================
       RENDER ACCOUNTS
    ========================= */

    function renderAccounts(results) {

      accountsResults.innerHTML = "";

      accountsCount.textContent =
        results.length
          ? `${results.length} نتيجة`
          : "";

      if (!results.length) {

        accountsEmpty.classList.remove("hidden");
        return;

      }

      accountsEmpty.classList.add("hidden");

      results.forEach(account => {

        const displayName =
          getDisplayName(account);

        const username =
          getUsername(account);

        const avatar =
          getAvatar(account);

        const firstLetter =
          escapeHTML(
            displayName
              .trim()
              .charAt(0)
              .toUpperCase() || "?"
          );

        const card = document.createElement("a");

        card.className = "account-card";

        card.href =
          `profile.html?uid=${encodeURIComponent(account.id)}`;

        const avatarHTML = avatar
          ? `<img
                src="${escapeHTML(avatar)}"
                alt="${escapeHTML(displayName)}"
                loading="lazy"
             >`
          : firstLetter;

        card.innerHTML = `

          <div class="avatar">
            ${avatarHTML}
          </div>

          <div class="account-info">

            <div class="display-name">
              ${escapeHTML(displayName)}
            </div>

            <div class="username">
              ${escapeHTML(username)}
            </div>

          </div>

        `;

        accountsResults.appendChild(card);

      });

    }


    /* =========================
       SEARCH
    ========================= */

    function performSearch() {

      const query =
        normalize(searchInput.value);

      if (!query) {

        worksResults.innerHTML = "";
        accountsResults.innerHTML = "";

        worksCount.textContent = "";
        accountsCount.textContent = "";

        worksEmpty.classList.add("hidden");
        accountsEmpty.classList.add("hidden");

        worksSection.classList.remove("hidden");
        accountsSection.classList.remove("hidden");

        initialMessage.classList.remove("hidden");

        return;
      }

      initialMessage.classList.add("hidden");

      const workResults =
        searchWorks(query);

      const accountResults =
        searchAccounts(query);

      renderWorks(workResults);
      renderAccounts(accountResults);

    }


    /* =========================
       SEARCH EVENTS
    ========================= */

    searchInput.addEventListener(
      "input",
      performSearch
    );


    /* =========================
       THEME
    ========================= */

    const themeBtn =
      document.getElementById("themeBtn");

    const savedTheme =
      localStorage.getItem("noctyra-theme");

    if (savedTheme === "light") {

      document.body.classList.add("light");
      themeBtn.textContent = "☀";

    }


    themeBtn.addEventListener("click", () => {

      document.body.classList.toggle("light");

      const isLight =
        document.body.classList.contains("light");

      localStorage.setItem(
        "noctyra-theme",
        isLight ? "light" : "dark"
      );

      themeBtn.textContent =
        isLight ? "☀" : "☾";

    });


    /* =========================
       START
    ========================= */

    loadData();

  </script>

</body>
</html>
