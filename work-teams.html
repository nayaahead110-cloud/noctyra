<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الفرق المالكة للأعمال | Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #24113d 0%,
          #0b0710 45%,
          #050407 100%
        );
      color: #eeeeee;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    select {
      font-family: inherit;
    }

    header {
      min-height: 75px;
      padding: 0 7%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(5, 4, 7, .88);
      border-bottom: 1px solid rgba(255, 255, 255, .08);

      backdrop-filter: blur(12px);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .logo span {
      color: #9b72bd;
    }

    .back {
      color: #c99cff;
      font-size: 14px;
      transition: .2s;
    }

    .back:hover {
      color: #ffffff;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px 70px;
    }

    .page-title {
      margin-bottom: 28px;
    }

    .page-title h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .page-title p {
      color: #93859d;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;

      padding: 18px;

      margin-bottom: 20px;

      border-radius: 15px;

      background: rgba(20, 14, 28, .90);
      border: 1px solid rgba(180, 120, 255, .15);
    }

    .toolbar-text {
      color: #93859d;
      font-size: 13px;
    }

    .refresh {
      padding: 9px 15px;

      border-radius: 8px;

      background: #18111f;
      border: 1px solid #392747;

      color: #c99cff;

      cursor: pointer;
      transition: .2s;
    }

    .refresh:hover {
      background: #251732;
      border-color: #765097;
      color: #ffffff;
    }

    .works-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .work-card {
      padding: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      border-radius: 16px;

      background: rgba(20, 14, 28, .92);

      border: 1px solid rgba(180, 120, 255, .15);

      transition: .2s;
    }

    .work-card:hover {
      border-color: rgba(180, 120, 255, .30);
    }

    .work-info {
      min-width: 0;
      flex: 1;
    }

    .work-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .work-id {
      color: #71657a;
      font-size: 11px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-team {
      margin-top: 8px;

      color: #b994d5;
      font-size: 13px;
    }

    .current-team.none {
      color: #817587;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;

      flex-shrink: 0;
    }

    select {
      min-width: 190px;

      padding: 10px 12px;

      border-radius: 9px;

      background: #120d18;
      border: 1px solid #392747;

      color: #eeeeee;

      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: #765097;
    }

    .save-btn {
      padding: 10px 15px;

      border-radius: 9px;

      background: #24132d;
      border: 1px solid #4c2b5f;

      color: #d5b5e8;

      cursor: pointer;

      transition: .2s;
    }

    .save-btn:hover {
      background: #32193e;
      border-color: #72448b;
      color: #ffffff;
    }

    .save-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .remove-btn {
      padding: 10px 12px;

      border-radius: 9px;

      background: #160d19;
      border: 1px solid #4a293f;

      color: #c58eae;

      cursor: pointer;

      transition: .2s;
    }

    .remove-btn:hover {
      background: #291321;
      border-color: #75435e;
      color: #ffffff;
    }

    .empty {
      padding: 45px 20px;

      text-align: center;

      color: #817587;

      border: 1px dashed #30253a;

      border-radius: 14px;

      background: rgba(20, 14, 28, .70);
    }

    .loading {
      text-align: center;

      color: #aaa;

      padding: 80px 20px;
    }

    .loading-icon {
      font-size: 28px;
      color: #8d6bb5;
      margin-bottom: 10px;
    }

    .denied {
      text-align: center;
      padding: 100px 20px;
    }

    .denied-icon {
      font-size: 40px;
      color: #765097;
      margin-bottom: 15px;
    }

    .denied h1 {
      margin-bottom: 10px;
    }

    .denied p {
      color: #93859d;
      margin-bottom: 22px;
    }

    .denied a {
      display: inline-block;

      padding: 11px 18px;

      border-radius: 8px;

      background: #24132d;

      border: 1px solid #4c2b5f;

      color: #c99cff;
    }

    .message {
      position: fixed;

      left: 20px;
      bottom: 20px;

      padding: 12px 18px;

      border-radius: 10px;

      background: #17101f;

      border: 1px solid #4c3560;

      color: #d5b5e8;

      font-size: 13px;

      opacity: 0;
      transform: translateY(10px);

      pointer-events: none;

      transition: .25s;

      z-index: 999;
    }

    .message.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 700px) {

      header {
        padding: 0 20px;
      }

      main {
        padding: 35px 15px 60px;
      }

      .page-title h1 {
        font-size: 27px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .work-card {
        align-items: stretch;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        flex-wrap: wrap;
      }

      select {
        flex: 1;
        min-width: 0;
      }

      .save-btn,
      .remove-btn {
        flex-shrink: 0;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      NOCTYRA<span>.</span>
    </div>

    <a
      href="admin.html"
      class="back"
    >
      العودة للوحة الإدارة
    </a>

  </header>


  <main id="content">

    <div class="loading">

      <div class="loading-icon">
        ✦
      </div>

      جاري التحقق من الحساب...

    </div>

  </main>


  <div
    class="message"
    id="message"
  ></div>


  <script type="module">

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs,
      doc,
      updateDoc,
      deleteField
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

      authDomain:
        "noctyra-4b71b.firebaseapp.com",

      projectId:
        "noctyra-4b71b",

      storageBucket:
        "noctyra-4b71b.firebasestorage.app",

      messagingSenderId:
        "240877556023",

      appId:
        "1:240877556023:web:99529c91607902b8414ab2",

      measurementId:
        "G-DYP839YDNK"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    const content =
      document.getElementById(
        "content"
      );


    const message =
      document.getElementById(
        "message"
      );


    const OWNER_EMAIL =
      "nayaahead110@gmail.com";


    /* =========================
       رسالة
    ========================= */

    function showMessage(text) {

      message.textContent = text;

      message.classList.add("show");

      setTimeout(() => {

        message.classList.remove("show");

      }, 2500);

    }


    /* =========================
       تحميل البيانات
    ========================= */

    async function loadData() {

      const worksSnapshot =
        await getDocs(
          collection(
            db,
            "works"
          )
        );


      const teamsSnapshot =
        await getDocs(
          collection(
            db,
            "teams"
          )
        );


      const teams = [];


      teamsSnapshot.forEach(
        teamDoc => {

          const data =
            teamDoc.data();


          teams.push({

            id:
              teamDoc.id,

            name:
              data.name ||
              data.teamName ||
              "فريق بدون اسم"

          });

        }
      );


      const works = [];


      worksSnapshot.forEach(
        workDoc => {

          const data =
            workDoc.data();


          works.push({

            id:
              workDoc.id,

            data:
              data

          });

        }
      );


      renderPage(
        works,
        teams
      );

    }


    /* =========================
       عرض الصفحة
    ========================= */

    function renderPage(
      works,
      teams
    ) {

      content.innerHTML = `

        <div class="page-title">

          <h1>
            الفرق المالكة للأعمال
          </h1>

          <p>
            تحديد الفريق المسؤول عن كل عمل وإدارة ملكية الأعمال.
          </p>

        </div>


        <div class="toolbar">

          <div class="toolbar-text">

            إجمالي الأعمال:
            <strong>${works.length}</strong>

            &nbsp; | &nbsp;

            إجمالي الفرق:
            <strong>${teams.length}</strong>

          </div>


          <button
            class="refresh"
            id="refreshBtn"
            type="button"
          >
            تحديث
          </button>

        </div>


        <div
          class="works-list"
          id="worksList"
        ></div>

      `;


      const worksList =
        document.getElementById(
          "worksList"
        );


      if (works.length === 0) {

        worksList.innerHTML = `

          <div class="empty">
            لا توجد أعمال حاليًا.
          </div>

        `;

      }

      else {

        works.forEach(
          work => {

            const data =
              work.data;


            const currentTeamId =
              data.teamId ||
              data.ownerTeamId ||
              "";


            const currentTeam =
              teams.find(
                team =>
                  team.id ===
                  currentTeamId
              );


            const currentTeamName =
              currentTeam
                ? currentTeam.name
                : (
                    data.teamName ||
                    data.ownerTeamName ||
                    ""
                  );


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "work-card";


            card.innerHTML = `

              <div class="work-info">

                <div class="work-name">
                  ${escapeHTML(
                    data.name ||
                    data.title ||
                    "عمل بدون اسم"
                  )}
                </div>

                <div class="work-id">
                  ID: ${escapeHTML(work.id)}
                </div>

                <div
                  class="current-team ${
                    currentTeamName
                      ? ""
                      : "none"
                  }"
                >

                  الفريق الحالي:
                  ${
                    currentTeamName
                      ? escapeHTML(
                          currentTeamName
                        )
                      : "لا يوجد فريق"
                  }

                </div>

              </div>


              <div class="actions">

                <select
                  class="team-select"
                >

                  <option value="">
                    بدون فريق
                  </option>

                  ${teams.map(
                    team => `

                      <option
                        value="${escapeHTML(team.id)}"
                        ${
                          team.id ===
                          currentTeamId
                            ? "selected"
                            : ""
                        }
                      >
                        ${escapeHTML(team.name)}
                      </option>

                    `
                  ).join("")}

                </select>


                <button
                  class="save-btn"
                  type="button"
                >
                  حفظ
                </button>


                <button
                  class="remove-btn"
                  type="button"
                >
                  إزالة
                </button>

              </div>

            `;


            const select =
              card.querySelector(
                ".team-select"
              );


            const saveBtn =
              card.querySelector(
                ".save-btn"
              );


            const removeBtn =
              card.querySelector(
                ".remove-btn"
              );


            saveBtn.addEventListener(
              "click",
              async () => {

                await saveTeam(
                  work.id,
                  select.value,
                  teams
                );

              }
            );


            removeBtn.addEventListener(
              "click",
              async () => {

                const confirmed =
                  confirm(
                    "هل تريد إزالة الفريق من هذا العمل؟"
                  );


                if (!confirmed) {
                  return;
                }


                await removeTeam(
                  work.id
                );

              }
            );


            worksList.appendChild(
              card
            );

          }
        );

      }


      document
        .getElementById("refreshBtn")
        .addEventListener(
          "click",
          async () => {

            content.innerHTML = `

              <div class="loading">

                <div class="loading-icon">
                  ✦
                </div>

                جاري تحديث البيانات...

              </div>

            `;


            try {

              await loadData();

            }

            catch (error) {

              console.error(error);

              showError();

            }

          }
        );

    }


    /* =========================
       حفظ الفريق
    ========================= */

    async function saveTeam(
      workId,
      teamId,
      teams
    ) {

      try {

        const workRef =
          doc(
            db,
            "works",
            workId
          );


        if (!teamId) {

          await updateDoc(
            workRef,
            {
              teamId:
                deleteField(),

              teamName:
                deleteField(),

              ownerTeamId:
                deleteField(),

              ownerTeamName:
                deleteField()
            }
          );


          showMessage(
            "تمت إزالة الفريق من العمل."
          );


          return;

        }


        const team =
          teams.find(
            item =>
              item.id ===
              teamId
          );


        if (!team) {

          showMessage(
            "الفريق غير موجود."
          );

          return;

        }


        await updateDoc(
          workRef,
          {

            teamId:
              team.id,

            teamName:
              team.name

          }
        );


        showMessage(
          "تم ربط العمل بالفريق بنجاح."
        );


        setTimeout(
          () => {
            loadData();
          },
          500
        );

      }

      catch (error) {

        console.error(
          "خطأ في ربط الفريق:",
          error
        );


        showMessage(
          "تعذر حفظ الفريق. تأكدي من صلاحيات Firestore."
        );

      }

    }


    /* =========================
       إزالة الفريق
    ========================= */

    async function removeTeam(
      workId
    ) {

      try {

        const workRef =
          doc(
            db,
            "works",
            workId
          );


        await updateDoc(
          workRef,
          {

            teamId:
              deleteField(),

            teamName:
              deleteField(),

            ownerTeamId:
              deleteField(),

            ownerTeamName:
              deleteField()

          }
        );


        showMessage(
          "تمت إزالة ملكية الفريق."
        );


        setTimeout(
          () => {
            loadData();
          },
          500
        );

      }

      catch (error) {

        console.error(
          "خطأ:",
          error
        );


        showMessage(
          "تعذر إزالة الفريق."
        );

      }

    }


    /* =========================
       حماية HTML
    ========================= */

    function escapeHTML(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* =========================
       خطأ
    ========================= */

    function showError() {

      content.innerHTML = `

        <div class="empty">

          تعذر تحميل بيانات الأعمال والفرق.

          <br><br>

          تأكدي من اتصال Firebase
          وقواعد Firestore.

        </div>

      `;

    }


    /* =========================
       التحقق من المالك
    ========================= */

    onAuthStateChanged(
      auth,
      async user => {

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        const currentEmail =
          (
            user.email || ""
          )
            .trim()
            .toLowerCase();


        const ownerEmail =
          OWNER_EMAIL
            .trim()
            .toLowerCase();


        if (
          currentEmail !==
          ownerEmail
        ) {

          content.innerHTML = `

            <div class="denied">

              <div class="denied-icon">
                ✦
              </div>

              <h1>
                غير مسموح
              </h1>

              <p>
                هذه الصفحة مخصصة لمالك موقع Noctyra فقط.
              </p>

              <a href="index.html">
                العودة للموقع
              </a>

            </div>

          `;

          return;

        }


        try {

          await loadData();

        }

        catch (error) {

          console.error(
            error
          );

          showError();

        }

      }
    );

  </script>

</body>

    </html>
