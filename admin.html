<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة الإدارة | Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #24113d 0%,
          #0b0710 45%,
          #050407 100%
        );
      color: #eeeeee;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      min-height: 75px;
      padding: 0 7%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: rgba(5, 4, 7, .88);
      border-bottom: 1px solid rgba(255, 255, 255, .08);

      backdrop-filter: blur(12px);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .logo span {
      color: #9b72bd;
    }

    .back {
      color: #c99cff;
      font-size: 14px;
      transition: .2s;
    }

    .back:hover {
      color: #ffffff;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1100px;
      margin: auto;
      padding: 45px 20px 70px;
    }

    /* =========================
       PAGE TITLE
    ========================= */

    .page-title {
      margin-bottom: 28px;
    }

    .page-title h1 {
      font-size: 32px;
      margin-bottom: 6px;
    }

    .page-title p {
      color: #93859d;
      font-size: 14px;
    }

    /* =========================
       OWNER
    ========================= */

    .owner-card {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      padding: 22px;

      margin-bottom: 30px;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          rgba(31, 19, 43, .95),
          rgba(15, 10, 20, .95)
        );

      border: 1px solid rgba(180, 120, 255, .20);
    }

    .owner-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .owner-avatar {
      width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #17101f;

      border: 1px solid #7e55a4;

      color: #c99cff;

      font-size: 20px;
    }

    .owner-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 2px;
    }

    .owner-username {
      color: #9b72bd;
      font-size: 13px;
    }

    .owner-badge {
      padding: 6px 11px;

      border-radius: 8px;

      background: rgba(155, 114, 189, .10);

      border: 1px solid rgba(155, 114, 189, .25);

      color: #c99cff;

      font-size: 11px;
      font-weight: bold;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;

      margin-bottom: 30px;
    }

    .stat {
      padding: 20px;

      background: rgba(20, 14, 28, .90);

      border: 1px solid rgba(180, 120, 255, .14);

      border-radius: 14px;
    }

    .stat-label {
      color: #817587;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: bold;
      color: #d4b6e9;
    }

    /* =========================
       MANAGEMENT GRID
    ========================= */

    .management-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .management-card {
      min-height: 175px;

      padding: 24px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      background: rgba(20, 14, 28, .92);

      border: 1px solid rgba(180, 120, 255, .15);

      border-radius: 17px;

      transition: .22s;
    }

    .management-card:hover {
      transform: translateY(-3px);
      border-color: rgba(180, 120, 255, .35);

      background: rgba(25, 17, 35, .96);
    }

    .card-icon {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;

      background: #17101f;

      border: 1px solid #30223c;

      color: #c99cff;

      font-size: 20px;

      margin-bottom: 16px;
    }

    .management-card h2 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .management-card p {
      color: #817587;
      font-size: 13px;
    }

    .card-button {
      display: inline-block;

      margin-top: 18px;

      padding: 10px 15px;

      width: fit-content;

      border-radius: 8px;

      background: #18111f;

      border: 1px solid #392747;

      color: #c99cff;

      font-size: 13px;

      transition: .2s;
    }

    .card-button:hover {
      background: #251732;
      border-color: #765097;
      color: #ffffff;
    }

    /* =========================
       SECTION
    ========================= */

    .section {
      margin-top: 30px;

      padding: 25px;

      border-radius: 17px;

      background: rgba(20, 14, 28, .90);

      border: 1px solid rgba(180, 120, 255, .15);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      margin-bottom: 18px;
    }

    .section-header h2 {
      font-size: 20px;
    }

    .section-header p {
      color: #817587;
      font-size: 12px;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      padding: 35px 15px;

      text-align: center;

      color: #817587;

      border: 1px dashed #30253a;

      border-radius: 12px;
    }

    /* =========================
       LOGOUT
    ========================= */

    .logout {
      width: 100%;

      margin-top: 30px;

      padding: 14px;

      border: 1px solid #4c2b5f;

      border-radius: 12px;

      background: #24132d;

      color: #d5b5e8;

      cursor: pointer;

      font-size: 14px;

      transition: .2s;
    }

    .logout:hover {
      background: #32193e;
      border-color: #72448b;
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      text-align: center;

      color: #aaa;

      padding: 80px 20px;
    }

    .loading-icon {
      font-size: 28px;
      color: #8d6bb5;
      margin-bottom: 10px;
    }

    /* =========================
       DENIED
    ========================= */

    .denied {
      text-align: center;
      padding: 100px 20px;
    }

    .denied-icon {
      font-size: 40px;
      color: #765097;
      margin-bottom: 15px;
    }

    .denied h1 {
      margin-bottom: 10px;
    }

    .denied p {
      color: #93859d;
      margin-bottom: 22px;
    }

    .denied a {
      display: inline-block;

      padding: 11px 18px;

      border-radius: 8px;

      background: #24132d;

      border: 1px solid #4c2b5f;

      color: #c99cff;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 800px) {

      header {
        padding: 0 20px;
      }

      main {
        padding: 35px 18px 60px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .management-grid {
        grid-template-columns: 1fr;
      }

    }

    @media (max-width: 500px) {

      .logo {
        font-size: 20px;
      }

      .page-title h1 {
        font-size: 27px;
      }

      .owner-card {
        align-items: flex-start;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat {
        padding: 16px;
      }

      .stat-number {
        font-size: 23px;
      }

    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <div class="logo">
      NOCTYRA<span>.</span>
    </div>

    <a
      href="index.html"
      class="back"
    >
      العودة للموقع
    </a>

  </header>


  <!-- =========================
       MAIN
  ========================= -->

  <main id="content">

    <div class="loading">

      <div class="loading-icon">
        ✦
      </div>

      جاري التحقق من الحساب...

    </div>

  </main>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      getDocs
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

      authDomain:
        "noctyra-4b71b.firebaseapp.com",

      projectId:
        "noctyra-4b71b",

      storageBucket:
        "noctyra-4b71b.firebasestorage.app",

      messagingSenderId:
        "240877556023",

      appId:
        "1:240877556023:web:99529c91607902b8414ab2",

      measurementId:
        "G-DYP839YDNK"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    const content =
      document.getElementById(
        "content"
      );


    /* =========================
       OWNER
    ========================= */

    const OWNER_EMAIL =
      "nayaahead110@gmail.com";


    /* =========================
       إنشاء رابط آمن
    ========================= */

    function go(page) {

      window.location.href =
        page;

    }


    /* =========================
       تحميل الإحصائيات
    ========================= */

    async function loadStats() {

      const stats = {

        works: 0,

        teams: 0,

        members: 0,

        chapters: 0

      };


      try {

        const worksSnapshot =
          await getDocs(
            collection(
              db,
              "works"
            )
          );

        stats.works =
          worksSnapshot.size;

      }

      catch (error) {

        console.error(
          "تعذر تحميل الأعمال:",
          error
        );

      }


      try {

        const teamsSnapshot =
          await getDocs(
            collection(
              db,
              "teams"
            )
          );

        stats.teams =
          teamsSnapshot.size;

      }

      catch (error) {

        console.error(
          "تعذر تحميل الفرق:",
          error
        );

      }


      try {

        const membersSnapshot =
          await getDocs(
            collection(
              db,
              "users"
            )
          );

        stats.members =
          membersSnapshot.size;

      }

      catch (error) {

        console.error(
          "تعذر تحميل الأعضاء:",
          error
        );

      }


      try {

        const chaptersSnapshot =
          await getDocs(
            collection(
              db,
              "chapters"
            )
          );

        stats.chapters =
          chaptersSnapshot.size;

      }

      catch (error) {

        console.error(
          "تعذر تحميل الفصول:",
          error
        );

      }


      return stats;

    }


    /* =========================
       عرض لوحة الإدارة
    ========================= */

    async function renderAdmin() {

      const stats =
        await loadStats();


      content.innerHTML = `

        <!-- عنوان الصفحة -->

        <div class="page-title">

          <h1>
            لوحة الإدارة
          </h1>

          <p>
            إدارة Noctyra والتحكم بالمحتوى والأعضاء والفرق.
          </p>

        </div>


        <!-- =====================
             OWNER
        ====================== -->

        <div class="owner-card">

          <div class="owner-info">

            <div class="owner-avatar">
              ♛
            </div>

            <div>

              <div class="owner-name">
                Owner
              </div>

              <div class="owner-username">
                @lur
              </div>

            </div>

          </div>


          <div class="owner-badge">
            مالك الموقع
          </div>

        </div>


        <!-- =====================
             الإحصائيات
        ====================== -->

        <div class="stats">

          <div class="stat">

            <div class="stat-label">
              الأعمال
            </div>

            <div class="stat-number">
              ${stats.works}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              الفرق
            </div>

            <div class="stat-number">
              ${stats.teams}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              الأعضاء
            </div>

            <div class="stat-number">
              ${stats.members}
            </div>

          </div>


          <div class="stat">

            <div class="stat-label">
              الفصول
            </div>

            <div class="stat-number">
              ${stats.chapters}
            </div>

          </div>

        </div>


        <!-- =====================
             الإدارة
        ====================== -->

        <div class="management-grid">


          <!-- تعديل الفرق -->

          <div class="management-card">

            <div>

              <div class="card-icon">
                ♜
              </div>

              <h2>
                تعديل الفرق
              </h2>

              <p>
                إنشاء وتعديل وحذف الفرق وإدارة بياناتها.
              </p>

            </div>

            <a
              href="teams.html"
              class="card-button"
            >
              إدارة الفرق
            </a>

          </div>


          <!-- إدارة الأعمال -->

          <div class="management-card">

            <div>

              <div class="card-icon">
                📚
              </div>

              <h2>
                إدارة الأعمال
              </h2>

              <p>
                إدارة الأعمال المنشورة وربط كل عمل بالفريق المالك له.
              </p>

            </div>

            <a
              href="works-admin.html"
              class="card-button"
            >
              إدارة الأعمال
            </a>

          </div>


          <!-- الفرق المالكة لها -->

          <div class="management-card">

            <div>

              <div class="card-icon">
                ◈
              </div>

              <h2>
                الفرق المالكة للأعمال
              </h2>

              <p>
                تحديد الفريق المسؤول عن كل عمل وإدارة ملكية الأعمال.
              </p>

            </div>

            <a
              href="work-teams.html"
              class="card-button"
            >
              إدارة الملكية
            </a>

          </div>


          <!-- إدارة الأعضاء -->

          <div class="management-card">

            <div>

              <div class="card-icon">
                ⚙
              </div>

              <h2>
                إدارة الأعضاء
              </h2>

              <p>
                إدارة صلاحيات الأعضاء وربطهم بالفرق.
              </p>

            </div>

            <a
              href="members-admin.html"
              class="card-button"
            >
              إدارة الأعضاء
            </a>

          </div>


          <!-- الأعضاء -->

          <div class="management-card">

            <div>

              <div class="card-icon">
                👥
              </div>

              <h2>
                الأعضاء
              </h2>

              <p>
                عرض أعضاء الموقع ومعلومات الحسابات العامة.
              </p>

            </div>

            <a
              href="members.html"
              class="card-button"
            >
              عرض الأعضاء
            </a>

          </div>


        </div>


        <!-- =====================
             ملاحظة
        ====================== -->

        <div class="section">

          <div class="section-header">

            <div>

              <h2>
                إدارة الموقع
              </h2>

              <p>
                الأدوات الإدارية الخاصة بالمالك.
              </p>

            </div>

          </div>


          <div class="empty">

            اختر إحدى أدوات الإدارة الموجودة بالأعلى
            للبدء.

          </div>

        </div>


        <!-- =====================
             LOGOUT
        ====================== -->

        <button
          class="logout"
          id="logoutBtn"
          type="button"
        >
          تسجيل الخروج
        </button>

      `;


      /* =========================
         تسجيل الخروج
      ========================= */

      const logoutBtn =
        document.getElementById(
          "logoutBtn"
        );


      logoutBtn.addEventListener(
        "click",
        async () => {

          try {

            await signOut(auth);

            window.location.href =
              "index.html";

          }

          catch (error) {

            console.error(
              error
            );

            alert(
              "حدث خطأ أثناء تسجيل الخروج."
            );

          }

        }
      );

    }


    /* =========================
       التحقق من المالك
    ========================= */

    onAuthStateChanged(
      auth,
      async (user) => {

        /* لا يوجد تسجيل دخول */

        if (!user) {

          window.location.href =
            "login.html";

          return;

        }


        /* تنظيف الإيميلات */

        const currentEmail =
          (user.email || "")
            .trim()
            .toLowerCase();


        const ownerEmail =
          OWNER_EMAIL
            .trim()
            .toLowerCase();


        /* المالك */

        if (
          currentEmail ===
          ownerEmail
        ) {

          await renderAdmin();

          return;

        }


        /* أي حساب آخر */

        content.innerHTML = `

          <div class="denied">

            <div class="denied-icon">
              ✦
            </div>

            <h1>
              غير مسموح
            </h1>

            <p>
              هذه الصفحة مخصصة لمالك موقع Noctyra فقط.
            </p>

            <a href="index.html">
              العودة للموقع
            </a>

          </div>

        `;

      }
    );

  </script>

</body>

</html>
