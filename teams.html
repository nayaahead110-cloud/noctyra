<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noctyra | الفرق</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(126, 87, 194, 0.12), transparent 30%),
        radial-gradient(circle at bottom left, rgba(91, 55, 140, 0.10), transparent 30%),
        #09070d;
      color: #eee;
      font-family: Tahoma, Arial, sans-serif;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    /* ================= HEADER ================= */

    header {
      height: 70px;
      background: rgba(10, 8, 15, 0.94);
      border-bottom: 1px solid rgba(171, 123, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #c8a7ff;
      letter-spacing: 1px;
    }

    .menu-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(200, 167, 255, 0.2);
      background: rgba(255, 255, 255, 0.03);
      color: #d9c5ff;
      border-radius: 12px;
      cursor: pointer;
      font-size: 21px;
      transition: 0.2s;
    }

    .menu-btn:hover {
      background: rgba(155, 105, 230, 0.12);
      border-color: rgba(200, 167, 255, 0.4);
    }

    /* ================= SIDE MENU ================= */

    .side-menu {
      position: fixed;
      top: 0;
      right: -290px;
      width: 270px;
      height: 100vh;
      background: #100c16;
      border-left: 1px solid rgba(180, 130, 255, 0.18);
      z-index: 200;
      padding: 25px;
      transition: right 0.3s ease;
      box-shadow: -10px 0 40px rgba(0, 0, 0, 0.35);
    }

    .side-menu.active {
      right: 0;
    }

    .side-menu h2 {
      color: #c7a5ff;
      margin-bottom: 30px;
      font-size: 21px;
    }

    .side-menu a {
      display: block;
      padding: 14px 12px;
      border-radius: 10px;
      margin-bottom: 7px;
      color: #bdb5c8;
      transition: 0.2s;
    }

    .side-menu a:hover {
      background: rgba(153, 104, 226, 0.1);
      color: #d9c4ff;
    }

    .close-menu {
      position: absolute;
      top: 18px;
      left: 18px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 150;
      display: none;
    }

    .overlay.active {
      display: block;
    }

    /* ================= MAIN ================= */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 45px 20px 70px;
    }

    .page-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .title-box h1 {
      font-size: 32px;
      color: #eee;
      margin-bottom: 8px;
    }

    .title-box p {
      color: #8f8798;
      font-size: 14px;
    }

    .create-btn {
      border: 1px solid rgba(190, 145, 255, 0.4);
      background: linear-gradient(
        135deg,
        rgba(126, 80, 190, 0.25),
        rgba(68, 38, 100, 0.25)
      );
      color: #d7bdff;
      padding: 12px 19px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.25s;
      white-space: nowrap;
    }

    .create-btn:hover {
      transform: translateY(-2px);
      border-color: #b88cff;
      background: rgba(138, 88, 200, 0.25);
    }

    /* ================= TEAMS ================= */

    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .team-card {
      background: linear-gradient(
        145deg,
        rgba(26, 20, 34, 0.96),
        rgba(13, 10, 18, 0.96)
      );
      border: 1px solid rgba(180, 135, 240, 0.13);
      border-radius: 18px;
      overflow: hidden;
      transition: 0.25s;
      cursor: pointer;
    }

    .team-card:hover {
      transform: translateY(-4px);
      border-color: rgba(184, 140, 255, 0.35);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .team-image {
      height: 190px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle, rgba(140, 88, 220, 0.2), transparent 60%),
        #120d19;
    }

    .team-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .default-team-image {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8c6bb4;
      font-size: 50px;
    }

    .team-info {
      padding: 18px;
    }

    .team-info h3 {
      color: #e7dcf5;
      font-size: 18px;
      margin-bottom: 9px;
    }

    .team-info p {
      color: #8d8597;
      font-size: 13px;
      line-height: 1.8;
      min-height: 47px;
    }

    .team-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      color: #81798b;
      font-size: 12px;
    }

    .leader-name {
      color: #c9a8ff;
    }

    /* ================= EMPTY ================= */

    .empty {
      text-align: center;
      padding: 80px 20px;
      border: 1px dashed rgba(177, 130, 238, 0.16);
      border-radius: 18px;
      color: #766e80;
    }

    .empty-icon {
      font-size: 45px;
      margin-bottom: 15px;
      opacity: 0.6;
    }

    .empty h3 {
      color: #aaa1b3;
      margin-bottom: 8px;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal.active {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: #110d17;
      border: 1px solid rgba(185, 139, 246, 0.2);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.55);
      position: relative;
    }

    .modal-box h2 {
      color: #d8c0ff;
      margin-bottom: 7px;
    }

    .modal-box .subtitle {
      color: #81798b;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .close-modal {
      position: absolute;
      top: 17px;
      left: 18px;
      border: none;
      background: none;
      color: #8c8494;
      font-size: 23px;
      cursor: pointer;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      color: #bdb3c7;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .field label span {
      color: #9b73c8;
      font-size: 11px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: #0b080e;
      color: #eee;
      border: 1px solid rgba(184, 139, 245, 0.16);
      outline: none;
      border-radius: 11px;
      padding: 12px 13px;
      font-size: 14px;
      transition: 0.2s;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(187, 137, 250, 0.5);
      box-shadow: 0 0 0 3px rgba(145, 89, 210, 0.07);
    }

    .field textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* ================= IMAGE ================= */

    .image-picker {
      border: 1px dashed rgba(185, 140, 245, 0.25);
      border-radius: 14px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.015);
    }

    .image-picker input {
      border: none;
      padding: 0;
      background: transparent;
    }

    .image-preview {
      width: 110px;
      height: 110px;
      border-radius: 16px;
      overflow: hidden;
      margin: 12px auto 0;
      border: 1px solid rgba(190, 145, 255, 0.25);
      display: none;
      background: #0b080e;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ================= SUBMIT ================= */

    .submit-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7547a8, #4d2875);
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .submit-btn:hover {
      filter: brightness(1.12);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error {
      display: none;
      background: rgba(180, 50, 70, 0.08);
      border: 1px solid rgba(220, 80, 100, 0.18);
      color: #db9aa6;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.6;
    }

    .success {
      display: none;
      background: rgba(90, 160, 120, 0.08);
      border: 1px solid rgba(90, 180, 130, 0.18);
      color: #9ed0b1;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
    }

    /* ================= LOADING ================= */

    .loading {
      text-align: center;
      padding: 60px;
      color: #81798b;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 2px solid rgba(190, 140, 250, 0.15);
      border-top-color: #a979dc;
      border-radius: 50%;
      margin: 0 auto 15px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= MOBILE ================= */

    @media (max-width: 650px) {
      header {
        padding: 0 15px;
      }

      main {
        padding: 30px 14px 50px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .title-box h1 {
        font-size: 27px;
      }

      .create-btn {
        width: 100%;
      }

      .teams-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="logo">Noctyra</div>

    <button class="menu-btn" id="menuBtn">☰</button>
  </header>

  <!-- SIDE MENU -->
  <div class="overlay" id="overlay"></div>

  <aside class="side-menu" id="sideMenu">
    <button class="close-menu" id="closeMenu">×</button>

    <h2>Noctyra</h2>

    <a href="index.html">الرئيسية</a>
    <a href="works.html">الأعمال</a>
    <a href="teams.html">الفرق</a>
    <a href="favorites.html">المفضلة</a>
    <a href="account.html">حسابي</a>
  </aside>

  <!-- MAIN -->
  <main>

    <div class="page-head">

      <div class="title-box">
        <h1>الفرق</h1>
        <p>اكتشف فرق الترجمة وأنشئ فريقك الخاص.</p>
      </div>

      <button class="create-btn" id="createTeamBtn">
        ＋ إنشاء فريق
      </button>

    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      جاري تحميل الفرق...
    </div>

    <div id="teamsGrid" class="teams-grid"></div>

    <div id="emptyState" class="empty" style="display:none;">
      <div class="empty-icon">♜</div>
      <h3>لا توجد فرق حتى الآن</h3>
      <p>كن أول من ينشئ فريقًا في Noctyra.</p>
    </div>

  </main>

  <!-- CREATE TEAM MODAL -->
  <div class="modal" id="teamModal">

    <div class="modal-box">

      <button class="close-modal" id="closeModal">×</button>

      <h2>إنشاء فريق</h2>
      <p class="subtitle">
        أنشئ فريقك وابدأ بإضافة الأعضاء والأعمال.
      </p>

      <div class="error" id="errorBox"></div>
      <div class="success" id="successBox"></div>

      <div class="field">
        <label>
          اسم الفريق
          <span>إجباري</span>
        </label>

        <input
          type="text"
          id="teamName"
          maxlength="60"
          placeholder="اكتب اسم الفريق..."
        >
      </div>

      <div class="field">

        <label>
          صورة الفريق
          <span>اختيارية</span>
        </label>

        <div class="image-picker">

          <input
            type="file"
            id="teamImage"
            accept="image/*"
          >

          <div class="image-preview" id="imagePreview">
            <img id="previewImg" src="" alt="صورة الفريق">
          </div>

        </div>

      </div>

      <div class="field">

        <label>
          نبذة عن الفريق
          <span>اختيارية</span>
        </label>

        <textarea
          id="teamDescription"
          maxlength="500"
          placeholder="اكتب نبذة قصيرة عن الفريق..."
        ></textarea>

      </div>

      <button class="submit-btn" id="submitTeam">
        إنشاء الفريق
      </button>

    </div>

  </div>


  <!-- FIREBASE -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      serverTimestamp
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* ================= FIREBASE CONFIG ================= */

    const firebaseConfig = {
      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",
      authDomain: "noctyra-4b71b.firebaseapp.com",
      projectId: "noctyra-4b71b",
      storageBucket: "noctyra-4b71b.firebasestorage.app",
      messagingSenderId: "240877556023",
      appId: "1:240877556023:web:99529c91607902b8414ab2",
      measurementId: "G-DYP839YDNK"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    /* ================= ELEMENTS ================= */

    const menuBtn = document.getElementById("menuBtn");
    const closeMenu = document.getElementById("closeMenu");
    const sideMenu = document.getElementById("sideMenu");
    const overlay = document.getElementById("overlay");

    const createTeamBtn = document.getElementById("createTeamBtn");

    const teamModal = document.getElementById("teamModal");
    const closeModal = document.getElementById("closeModal");

    const teamName = document.getElementById("teamName");
    const teamImage = document.getElementById("teamImage");
    const teamDescription = document.getElementById("teamDescription");

    const imagePreview = document.getElementById("imagePreview");
    const previewImg = document.getElementById("previewImg");

    const submitTeam = document.getElementById("submitTeam");

    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");

    const teamsGrid = document.getElementById("teamsGrid");
    const emptyState = document.getElementById("emptyState");
    const loading = document.getElementById("loading");


    let currentUser = null;
    let selectedImageData = "";


    /* ================= MENU ================= */

    menuBtn.addEventListener("click", () => {
      sideMenu.classList.add("active");
      overlay.classList.add("active");
    });

    closeMenu.addEventListener("click", closeSideMenu);
    overlay.addEventListener("click", closeSideMenu);

    function closeSideMenu() {
      sideMenu.classList.remove("active");
      overlay.classList.remove("active");
    }


    /* ================= AUTH ================= */

    await setPersistence(auth, browserLocalPersistence);

    onAuthStateChanged(auth, async (user) => {

      currentUser = user;

      await loadTeams();

    });


    /* ================= OPEN MODAL ================= */

    createTeamBtn.addEventListener("click", () => {

      if (!currentUser) {
        window.location.href = "login.html";
        return;
      }

      resetForm();

      teamModal.classList.add("active");

    });


    closeModal.addEventListener("click", () => {
      teamModal.classList.remove("active");
    });


    teamModal.addEventListener("click", (e) => {

      if (e.target === teamModal) {
        teamModal.classList.remove("active");
      }

    });


    /* ================= IMAGE ================= */

    teamImage.addEventListener("change", async () => {

      const file = teamImage.files[0];

      if (!file) {
        selectedImageData = "";
        imagePreview.style.display = "none";
        return;
      }

      if (!file.type.startsWith("image/")) {

        showError("الملف المختار ليس صورة.");

        teamImage.value = "";

        return;
      }

      try {

        selectedImageData = await compressImage(file);

        previewImg.src = selectedImageData;
        imagePreview.style.display = "block";

        hideMessages();

      } catch (error) {

        console.error(error);

        showError("تعذر تجهيز الصورة.");

      }

    });


    /* ================= IMAGE COMPRESSION ================= */

    function compressImage(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => {

          const img = new Image();

          img.onload = () => {

            const canvas = document.createElement("canvas");

            const maxSize = 500;

            let width = img.width;
            let height = img.height;

            if (width > height) {

              if (width > maxSize) {

                height = Math.round(height * maxSize / width);
                width = maxSize;

              }

            } else {

              if (height > maxSize) {

                width = Math.round(width * maxSize / height);
                height = maxSize;

              }

            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            const compressed = canvas.toDataURL(
              "image/jpeg",
              0.75
            );

            resolve(compressed);

          };

          img.onerror = reject;

          img.src = reader.result;

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

      });

    }


    /* ================= CREATE TEAM ================= */

    submitTeam.addEventListener("click", async () => {

      hideMessages();

      if (!currentUser) {

        window.location.href = "login.html";

        return;

      }

      const name = teamName.value.trim();
      const description = teamDescription.value.trim();

      if (!name) {

        showError("اسم الفريق إجباري.");

        teamName.focus();

        return;

      }

      submitTeam.disabled = true;
      submitTeam.textContent = "جاري إنشاء الفريق...";


      try {

        const creatorName =
          currentUser.displayName ||
          currentUser.email?.split("@")[0] ||
          "عضو";


        const leader = {

          uid: currentUser.uid,

          name: creatorName,

          email: currentUser.email || "",

          role: "leader",

          joinedAt: new Date().toISOString()

        };


        const teamData = {

          name: name,

          description: description,

          image: selectedImageData || "",

          ownerId: currentUser.uid,

          ownerName: creatorName,

          members: [leader],

          works: [],

          createdAt: serverTimestamp()

        };


        const teamRef = await addDoc(
          collection(db, "teams"),
          teamData
        );


        showSuccess("تم إنشاء الفريق بنجاح.");

        setTimeout(() => {

          window.location.href =
            "team.html?id=" + teamRef.id;

        }, 700);


      } catch (error) {

        console.error(error);

        if (
          error.code === "permission-denied"
        ) {

          showError(
            "تم رفض إنشاء الفريق من قاعدة البيانات. تأكدي من إضافة قواعد teams التي أرسلتها لك."
          );

        } else {

          showError(
            "حدث خطأ أثناء إنشاء الفريق: " +
            (error.message || "خطأ غير معروف")
          );

        }

      } finally {

        submitTeam.disabled = false;
        submitTeam.textContent = "إنشاء الفريق";

      }

    });


    /* ================= LOAD TEAMS ================= */

    async function loadTeams() {

      loading.style.display = "block";
      teamsGrid.innerHTML = "";
      emptyState.style.display = "none";


      try {

        const snapshot = await getDocs(
          collection(db, "teams")
        );


        loading.style.display = "none";


        if (snapshot.empty) {

          emptyState.style.display = "block";

          return;

        }


        const teams = [];

        snapshot.forEach((doc) => {

          teams.push({
            id: doc.id,
            ...doc.data()
          });

        });


        teams.sort((a, b) => {

          const aTime =
            a.createdAt?.seconds || 0;

          const bTime =
            b.createdAt?.seconds || 0;

          return bTime - aTime;

        });


        teams.forEach((team) => {

          renderTeam(team);

        });


      } catch (error) {

        console.error(error);

        loading.style.display = "none";

        teamsGrid.innerHTML = `
          <div class="empty" style="display:block;grid-column:1/-1;">
            <div class="empty-icon">⚠</div>
            <h3>تعذر تحميل الفرق</h3>
            <p>
              تأكدي من قواعد Firestore الخاصة بـ teams.
            </p>
          </div>
        `;

      }

    }


    /* ================= RENDER TEAM ================= */

    function renderTeam(team) {

      const card = document.createElement("a");

      card.className = "team-card";

      card.href =
        "team.html?id=" +
        encodeURIComponent(team.id);


      const members =
        Array.isArray(team.members)
          ? team.members.length
          : 0;


      let imageHTML = `
        <div class="default-team-image">
          ♜
        </div>
      `;


      if (team.image) {

        imageHTML = `
          <img
            src="${team.image}"
            alt="${escapeHTML(team.name || "الفريق")}"
          >
        `;

      }


      card.innerHTML = `

        <div class="team-image">
          ${imageHTML}
        </div>

        <div class="team-info">

          <h3>
            ${escapeHTML(team.name || "فريق بدون اسم")}
          </h3>

          <p>
            ${
              escapeHTML(
                team.description ||
                "لا توجد نبذة عن هذا الفريق."
              )
            }
          </p>

          <div class="team-meta">

            <span>
              👥 ${members} عضو
            </span>

            <span class="leader-name">
              👑 ${escapeHTML(
                team.ownerName || "القائد"
              )}
            </span>

          </div>

        </div>
      `;


      teamsGrid.appendChild(card);

    }


    /* ================= RESET ================= */

    function resetForm() {

      teamName.value = "";
      teamDescription.value = "";
      teamImage.value = "";

      selectedImageData = "";

      imagePreview.style.display = "none";
      previewImg.src = "";

      hideMessages();

    }


    /* ================= MESSAGES ================= */

    function showError(message) {

      errorBox.textContent = message;
      errorBox.style.display = "block";

    }

    function showSuccess(message) {

      successBox.textContent = message;
      successBox.style.display = "block";

    }

    function hideMessages() {

      errorBox.style.display = "none";
      successBox.style.display = "none";

    }


    /* ================= SECURITY DISPLAY ================= */

    function escapeHTML(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

  </script>

</body>
</html>
