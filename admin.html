<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة المالك | Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #24113d 0%, #0b0710 45%, #050407 100%);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      background: rgba(5, 4, 7, .85);
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .back {
      color: #c99cff;
      text-decoration: none;
      font-size: 14px;
    }

    main {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    .title {
      margin-bottom: 30px;
    }

    .title h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .title p {
      color: #93859d;
    }

    .owner-box {
      padding: 22px;
      margin-bottom: 25px;
      border-radius: 16px;
      background: rgba(20, 14, 28, .9);
      border: 1px solid rgba(180, 120, 255, .18);
    }

    .owner-box h2 {
      margin-bottom: 10px;
    }

    .owner-box span {
      color: #c99cff;
    }

    .section {
      padding: 25px;
      border-radius: 18px;
      background: rgba(20, 14, 28, .9);
      border: 1px solid rgba(180, 120, 255, .18);
    }

    .section h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .empty {
      padding: 35px 15px;
      text-align: center;
      color: #817587;
    }

    .logout {
      margin-top: 25px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #6e3b8f;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .logout:hover {
      background: #8249a5;
    }

    .loading {
      text-align: center;
      color: #aaa;
      padding: 50px;
    }

    .denied {
      text-align: center;
      padding: 60px 20px;
    }

    .denied h1 {
      margin-bottom: 12px;
    }

    .denied p {
      color: #93859d;
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      NOCTYRA
    </div>

    <a href="index.html" class="back">
      العودة للموقع
    </a>

  </header>


  <main id="content">

    <div class="loading">
      جاري التحقق من الحساب...
    </div>

  </main>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

      authDomain: "noctyra-4b71b.firebaseapp.com",

      projectId: "noctyra-4b71b",

      storageBucket: "noctyra-4b71b.firebasestorage.app",

      messagingSenderId: "240877556023",

      appId: "1:240877556023:web:99529c91607902b8414ab2",

      measurementId: "G-DYP839YDNK"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const content =
      document.getElementById("content");


    // إيميل مالك الموقع
    const OWNER_EMAIL =
      "nayaahead110@gmail.com";


    onAuthStateChanged(auth, (user) => {

      // إذا ما فيه تسجيل دخول
      if (!user) {

        window.location.href = "login.html";

        return;
      }


      // تنظيف الإيميل للمقارنة
      const currentEmail =
        (user.email || "")
          .trim()
          .toLowerCase();


      const ownerEmail =
        OWNER_EMAIL
          .trim()
          .toLowerCase();


      // حساب المالك
      if (currentEmail === ownerEmail) {

        content.innerHTML = `

          <div class="title">

            <h1>
              لوحة المالك
            </h1>

            <p>
              إدارة موقع Noctyra
            </p>

          </div>


          <div class="owner-box">

            <h2>
              مرحبًا بك في لوحة التحكم ✦
            </h2>

            <p>
              الحالة:
              <span>مالك الموقع ✓</span>
            </p>

          </div>


          <div class="section">

            <h2>
              طلبات النشر
            </h2>

            <div class="empty">

              لا توجد طلبات نشر حاليًا.

            </div>

          </div>


          <button
            class="logout"
            id="logoutBtn">

            تسجيل الخروج

          </button>

        `;


        const logoutBtn =
          document.getElementById("logoutBtn");


        logoutBtn.addEventListener(
          "click",
          async () => {

            try {

              await signOut(auth);

              window.location.href =
                "index.html";

            } catch (error) {

              alert(
                "حدث خطأ أثناء تسجيل الخروج"
              );

            }

          }
        );


      } else {

        // أي حساب ثاني = عضو
        content.innerHTML = `

          <div class="denied">

            <h1>
              غير مسموح
            </h1>

            <p>
              هذه الصفحة مخصصة لمالك الموقع فقط.
            </p>

          </div>

        `;

      }

    });

  </script>

</body>

</html>
