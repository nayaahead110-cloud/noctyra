<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تسجيل الدخول — Noctyra</title><style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 35%, #21172c 0%, #0b0a0e 45%, #060608 100%);
  color: #eee;
  font-family: Arial, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-container {
  width: 100%;
  max-width: 430px;
}

.brand {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 8px;
}

.logo span {
  color: #9b72bd;
}

.line {
  width: 45px;
  height: 1px;
  background: #76548f;
  margin: 14px auto 0;
}

.login-box {
  position: relative;

  background: rgba(15, 14, 19, 0.96);

  border: 1px solid #29242f;
  border-radius: 10px;

  padding: 40px 30px;

  box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

.corner {
  position: absolute;
  width: 16px;
  height: 16px;
  opacity: .6;
}

.top-right {
  top: 12px;
  right: 12px;
  border-top: 1px solid #8b68a5;
  border-right: 1px solid #8b68a5;
}

.top-left {
  top: 12px;
  left: 12px;
  border-top: 1px solid #8b68a5;
  border-left: 1px solid #8b68a5;
}

.bottom-right {
  bottom: 12px;
  right: 12px;
  border-bottom: 1px solid #8b68a5;
  border-right: 1px solid #8b68a5;
}

.bottom-left {
  bottom: 12px;
  left: 12px;
  border-bottom: 1px solid #8b68a5;
  border-left: 1px solid #8b68a5;
}

h1 {
  text-align: center;
  font-size: 25px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #77727d;
  font-size: 13px;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  color: #bdb8c2;
  font-size: 13px;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;

  background: #09090c;
  color: white;

  border: 1px solid #2b2730;
  border-radius: 6px;

  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #805da0;
}

button {
  width: 100%;
  padding: 14px;

  background: #eee;
  color: #09090c;

  border: 1px solid #eee;
  border-radius: 6px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

.divider {
  text-align: center;
  color: #55515b;
  font-size: 12px;
  margin: 25px 0;
}

.create {
  text-align: center;
  color: #77727d;
  font-size: 13px;
}

.create a {
  color: #ad8bc2;
  text-decoration: none;
}

.back {
  display: block;
  text-align: center;

  color: #66616b;
  text-decoration: none;

  font-size: 12px;
  margin-top: 25px;
}

.decor {
  position: fixed;
  color: #8b68a5;
  opacity: .35;
  pointer-events: none;
}

.d1 {
  top: 20%;
  right: 12%;
}

.d2 {
  bottom: 20%;
  left: 12%;
}

@media (max-width: 500px) {

  .login-box {
    padding: 35px 22px;
  }

  .logo {
    font-size: 26px;
    letter-spacing: 6px;
  }

}

</style></head><body><div class="decor d1">✦</div>
<div class="decor d2">✧</div><main class="login-container">  <div class="brand"><div class="logo">
  NOCTYRA<span>.</span>
</div>

<div class="line"></div>

  </div>  <section class="login-box"><div class="corner top-right"></div>
<div class="corner top-left"></div>
<div class="corner bottom-right"></div>
<div class="corner bottom-left"></div>


<h1>
  تسجيل الدخول
</h1>

<p class="subtitle">
  ادخل إلى عالم Noctyra
</p>


<form>

  <div class="form-group">

    <label for="email">
      البريد الإلكتروني
    </label>

    <input
      id="email"
      type="email"
      placeholder="example@email.com"
      required
    >

  </div>


  <div class="form-group">

    <label for="password">
      كلمة المرور
    </label>

    <input
      id="password"
      type="password"
      placeholder="••••••••"
      required
    >

  </div>


  <button type="submit">
    تسجيل الدخول
  </button>

</form>


<div class="divider">
  ✦
</div>


<div class="create">
  ليس لديك حساب؟
  <a href="#">
    إنشاء حساب
  </a>
</div>


<a href="index.html" class="back">
  ← العودة إلى الرئيسية
</a>

  </section></main></body>
</html>
