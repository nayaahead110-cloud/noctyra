<!DOCTYPE html><html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تسجيل الدخول — Noctyra</title><style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at 50% 35%, #21172c 0%, #0b0a0e 45%, #060608 100%);
  color: #eee;
  font-family: Arial, sans-serif;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;
}

.login-container {
  width: 100%;
  max-width: 430px;
}

.brand {
  text-align: center;
  margin-bottom: 25px;
}

.logo {
  font-size: 30px;
  font-weight: bold;
  letter-spacing: 8px;
}

.logo span {
  color: #9b72bd;
}

.line {
  width: 45px;
  height: 1px;
  background: #76548f;
  margin: 14px auto 0;
}

.login-box {
  background: rgba(15, 14, 19, 0.96);
  border: 1px solid #29242f;
  border-radius: 10px;

  padding: 40px 30px;

  box-shadow: 0 25px 70px rgba(0,0,0,.5);
}

h1 {
  text-align: center;
  font-size: 25px;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #77727d;
  font-size: 13px;
  margin-bottom: 30px;
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  color: #bdb8c2;
  font-size: 13px;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 14px;

  background: #09090c;
  color: white;

  border: 1px solid #2b2730;
  border-radius: 6px;

  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #805da0;
}

button {
  width: 100%;
  padding: 14px;

  background: #eee;
  color: #09090c;

  border: 1px solid #eee;
  border-radius: 6px;

  font-size: 14px;
  font-weight: bold;

  cursor: pointer;
}

button:hover {
  background: transparent;
  color: #eee;
}

.switch {
  margin-top: 12px;
  background: transparent;
  color: #b18bc8;
  border: 1px solid #393340;
}

.message {
  min-height: 20px;
  margin-top: 18px;

  text-align: center;

  color: #b18bc8;
  font-size: 13px;
}

.back {
  display: block;
  text-align: center;

  color: #66616b;
  text-decoration: none;

  font-size: 12px;
  margin-top: 25px;
}

@media (max-width: 500px) {

  .login-box {
    padding: 35px 22px;
  }

  .logo {
    font-size: 26px;
    letter-spacing: 6px;
  }

}

</style></head><body><main class="login-container">  <div class="brand"><div class="logo">
  NOCTYRA<span>.</span>
</div>

<div class="line"></div>

  </div>  <section class="login-box"><h1 id="title">
  تسجيل الدخول
</h1>

<p class="subtitle" id="subtitle">
  ادخل إلى عالم Noctyra
</p>


<form id="authForm">

  <div class="form-group">

    <label for="email">
      البريد الإلكتروني
    </label>

    <input
      id="email"
      type="email"
      placeholder="example@email.com"
      required
    >

  </div>


  <div class="form-group">

    <label for="password">
      كلمة المرور
    </label>

    <input
      id="password"
      type="password"
      placeholder="••••••••"
      minlength="6"
      required
    >

  </div>


  <div
    class="form-group"
    id="confirmGroup"
    style="display:none;"
  >

    <label for="confirmPassword">
      تأكيد كلمة المرور
    </label>

    <input
      id="confirmPassword"
      type="password"
      placeholder="••••••••"
    >

  </div>


  <button type="submit" id="submitButton">
    تسجيل الدخول
  </button>


  <button
    type="button"
    class="switch"
    id="switchButton"
  >
    إنشاء حساب جديد
  </button>

</form>


<div
  class="message"
  id="message"
></div>


<a
  href="index.html"
  class="back"
>
  ← العودة إلى الرئيسية
</a>

  </section></main><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const firebaseConfig = {

  apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

  authDomain:
    "noctyra-4b71b.firebaseapp.com",

  projectId:
    "noctyra-4b71b",

  storageBucket:
    "noctyra-4b71b.firebasestorage.app",

  messagingSenderId:
    "240877556023",

  appId:
    "1:240877556023:web:99529c91607902b8414ab2",

  measurementId:
    "G-DYP839YDNK"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


const form =
  document.getElementById("authForm");

const email =
  document.getElementById("email");

const password =
  document.getElementById("password");

const confirmPassword =
  document.getElementById("confirmPassword");

const confirmGroup =
  document.getElementById("confirmGroup");

const submitButton =
  document.getElementById("submitButton");

const switchButton =
  document.getElementById("switchButton");

const title =
  document.getElementById("title");

const subtitle =
  document.getElementById("subtitle");

const message =
  document.getElementById("message");


let registerMode = false;


switchButton.addEventListener(
  "click",
  () => {

    registerMode = !registerMode;

    message.textContent = "";

    if (registerMode) {

      title.textContent =
        "إنشاء حساب";

      subtitle.textContent =
        "أنشئ حسابك في Noctyra";

      submitButton.textContent =
        "إنشاء الحساب";

      switchButton.textContent =
        "لدي حساب بالفعل";

      confirmGroup.style.display =
        "block";

      confirmPassword.required =
        true;

    } else {

      title.textContent =
        "تسجيل الدخول";

      subtitle.textContent =
        "ادخل إلى عالم Noctyra";

      submitButton.textContent =
        "تسجيل الدخول";

      switchButton.textContent =
        "إنشاء حساب جديد";

      confirmGroup.style.display =
        "none";

      confirmPassword.required =
        false;

    }

  }
);


form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();

    message.textContent = "";

    const emailValue =
      email.value.trim();

    const passwordValue =
      password.value;


    try {

      if (registerMode) {

        if (
          passwordValue !==
          confirmPassword.value
        ) {

          message.textContent =
            "كلمتا المرور غير متطابقتين.";

          return;
        }


        await createUserWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );


        message.textContent =
          "تم إنشاء الحساب بنجاح ✓";


      } else {

        await signInWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );


        message.textContent =
          "تم تسجيل الدخول بنجاح ✓";

      }


    } catch (error) {

      console.error(error);


      if (
        error.code ===
        "auth/email-already-in-use"
      ) {

        message.textContent =
          "هذا البريد مستخدم بالفعل.";

      }

      else if (
        error.code ===
        "auth/invalid-email"
      ) {

        message.textContent =
          "البريد الإلكتروني غير صحيح.";

      }

      else if (
        error.code ===
        "auth/weak-password"
      ) {

        message.textContent =
          "كلمة المرور يجب أن تكون 6 أحرف على الأقل.";

      }

      else if (
        error.code ===
        "auth/invalid-credential"
      ) {

        message.textContent =
          "البريد أو كلمة المرور غير صحيحة.";

      }

      else {

        message.textContent =
          "حدث خطأ، حاولي مرة أخرى.";

      }

    }

  }
);

</script></body>
</html>
