<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noctyra | العمل</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #09090c;
      color: #eeeeee;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 9, 12, 0.94);
      border-bottom: 1px solid #222229;
      backdrop-filter: blur(12px);
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      min-height: 70px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .logo span {
      color: #8d6bb5;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      color: #9999a3;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #fff;
    }

    .menu-btn {
      background: none;
      border: 0;
      color: #eee;
      font-size: 27px;
      cursor: pointer;
      padding: 5px;
    }

    .side-menu {
      position: fixed;
      top: 0;
      right: -330px;

      width: 310px;
      max-width: 85%;
      height: 100vh;

      background: #0d0c11;
      border-left: 1px solid #29242f;

      z-index: 1000;
      padding: 25px;

      transition: right .3s ease;

      box-shadow: -20px 0 60px rgba(0, 0, 0, .45);
    }

    .side-menu.open {
      right: 0;
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-bottom: 22px;
      margin-bottom: 20px;

      border-bottom: 1px solid #25212b;
    }

    .menu-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .close-menu {
      background: none;
      border: 0;
      color: #77727d;
      font-size: 27px;
      cursor: pointer;
    }

    .menu-links {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu-links a {
      display: block;
      padding: 14px 15px;
      color: #aaa6b0;
      border-radius: 7px;
      font-size: 14px;
      transition: .2s;
    }

    .menu-links a:hover {
      background: #17141c;
      color: #fff;
      padding-right: 20px;
    }

    .menu-divider {
      height: 1px;
      background: #25212b;
      margin: 15px 0;
    }

    .menu-login {
      color: #9b72bd !important;
    }

    .menu-management {
      color: #c39be8 !important;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, .55);

      z-index: 999;

      opacity: 0;
      visibility: hidden;

      transition: .3s;
    }

    .menu-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    .work-hero {
      position: relative;
      overflow: hidden;

      border-bottom: 1px solid #222229;

      background:
        radial-gradient(
          circle at 70% 30%,
          rgba(91, 61, 125, .25),
          transparent 45%
        ),
        linear-gradient(
          180deg,
          #111018,
          #09090c
        );
    }

    .work-main {
      max-width: 1100px;
      margin: auto;
      padding: 70px 24px;

      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 45px;

      align-items: start;
    }

    .cover-wrapper {
      position: relative;
    }

    .work-cover {
      width: 260px;
      height: 370px;

      display: block;

      object-fit: cover;

      border-radius: 9px;

      background: #15131a;
      border: 1px solid #302a38;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, .5);
    }

    .no-cover {
      width: 260px;
      height: 370px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #111016;
      border: 1px solid #302a38;
      border-radius: 9px;

      color: #635a6e;
      font-size: 45px;
    }

    .work-info {
      padding-top: 5px;
    }

    .work-label {
      color: #80639c;
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .work-title {
      font-size: clamp(30px, 5vw, 50px);
      line-height: 1.2;
      margin-bottom: 7px;
    }

    .original-name {
      color: #777781;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stars {
      color: #c4a76b;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .rating-number {
      color: #bcb8c3;
      font-size: 13px;
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 25px;
    }

    .category {
      padding: 5px 10px;

      background: #15121b;
      border: 1px solid #30283a;

      color: #bba2cc;

      border-radius: 5px;
      font-size: 11px;
    }

    .description-title {
      font-size: 16px;
      margin-bottom: 8px;
    }

    .description {
      max-width: 700px;
      color: #9999a3;
      font-size: 14px;
      line-height: 2;
      white-space: pre-line;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .action-btn {
      min-height: 43px;

      padding: 10px 17px;

      border-radius: 6px;

      background: #111016;
      border: 1px solid #302a38;

      color: #aaa6b0;

      cursor: pointer;

      transition: .2s;
      font-size: 13px;
    }

    .action-btn:hover {
      border-color: #80639c;
      color: #fff;
    }

    .action-btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    .action-btn.active {
      background: #1a1421;
      border-color: #8d6bb5;
      color: #d8bce9;
    }

    .like-btn.active {
      color: #e3a2d5;
      border-color: #8d5e86;
    }

    .favorite-btn.active {
      color: #d3b26f;
      border-color: #806a42;
    }

    .later-btn.active {
      color: #b99bd0;
      border-color: #71548f;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 70px 24px;
    }

    .section {
      margin-bottom: 65px;
    }

    .section-head {
      margin-bottom: 22px;
    }

    .section-title {
      font-size: 27px;
      margin-bottom: 5px;
    }

    .section-subtitle {
      color: #6f6c76;
      font-size: 12px;
    }

    .chapters {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .chapter {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;

      padding: 15px 18px;

      background: #101015;
      border: 1px solid #222229;
      border-radius: 7px;

      transition: .2s;
    }

    .chapter:hover {
      border-color: #70528d;
      background: #121018;
    }

    .chapter-left {
      min-width: 0;
    }

    .chapter-name {
      font-size: 14px;
      font-weight: bold;
    }

    .chapter-meta {
      color: #696671;
      font-size: 11px;
      margin-top: 3px;
    }

    .read-chapter {
      flex-shrink: 0;

      padding: 7px 13px;

      background: #17131d;
      border: 1px solid #342a3f;

      border-radius: 5px;

      color: #b99bd0;

      font-size: 11px;
    }

    .comment-box {
      background: #101015;
      border: 1px solid #222229;
      border-radius: 8px;

      padding: 18px;
      margin-bottom: 25px;
    }

    .comment-login {
      color: #777781;
      font-size: 13px;
    }

    .comment-login a {
      color: #b18dcc;
    }

    .comment-form {
      display: none;
    }

    .comment-form textarea {
      width: 100%;
      min-height: 110px;

      resize: vertical;

      background: #0c0c10;
      border: 1px solid #292631;
      border-radius: 7px;

      padding: 13px;

      color: #eee;
      outline: none;

      font-size: 13px;
    }

    .comment-form textarea:focus {
      border-color: #80639c;
    }

    .comment-form textarea::placeholder {
      color: #5e5b64;
    }

    .comment-submit {
      margin-top: 10px;

      padding: 9px 18px;

      background: #eee;
      color: #09090c;

      border: 1px solid #eee;
      border-radius: 5px;

      font-weight: bold;
      cursor: pointer;

      font-size: 12px;
    }

    .comment-submit:disabled {
      opacity: .5;
      cursor: wait;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .comment {
      background: #101015;
      border: 1px solid #222229;
      border-radius: 8px;

      padding: 16px;
    }

    .comment-top {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 8px;
    }

    .comment-avatar {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      object-fit: cover;

      background: #17141c;
      border: 1px solid #302a38;

      flex-shrink: 0;
    }

    .comment-avatar-empty {
      display: flex;
      align-items: center;
      justify-content: center;

      color: #746b7c;
      font-size: 16px;
    }

    .comment-user {
      font-size: 13px;
      font-weight: bold;
    }

    .comment-date {
      color: #625f68;
      font-size: 10px;
    }

    .comment-text {
      color: #aaa6b0;
      font-size: 13px;
      line-height: 1.9;

      white-space: pre-line;
      word-break: break-word;
    }

    .delete-comment {
      float: left;

      background: none;
      border: 0;

      color: #625c66;

      cursor: pointer;
      font-size: 11px;
    }

    .delete-comment:hover {
      color: #b98aa7;
    }

    .empty-box {
      text-align: center;

      padding: 35px 20px;

      color: #66636d;

      background: #101015;
      border: 1px solid #222229;
      border-radius: 8px;

      font-size: 13px;
    }

    .loading {
      min-height: 450px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #777481;
      font-size: 14px;
    }

    .error-box {
      min-height: 450px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .error-box h2 {
      margin-bottom: 8px;
    }

    .error-box p {
      color: #777781;
      margin-bottom: 20px;
      font-size: 13px;
    }

    .footer {
      border-top: 1px solid #222229;

      padding: 45px 24px;

      text-align: center;

      color: #666670;
    }

    .footer-logo {
      color: #eee;
      font-weight: bold;
      letter-spacing: 5px;
      margin-bottom: 10px;
    }

    .footer p {
      font-size: 12px;
    }

    @media (max-width: 700px) {

      .nav {
        min-height: 65px;
        padding: 0 18px;
      }

      .nav-links {
        display: none;
      }

      .container {
        padding: 55px 20px;
      }

      .work-main {
        padding: 45px 20px;

        grid-template-columns: 1fr;

        gap: 30px;
      }

      .cover-wrapper {
        display: flex;
        justify-content: center;
      }

      .work-cover,
      .no-cover {
        width: 210px;
        height: 300px;
      }

      .work-title {
        font-size: 31px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .action-btn {
        width: 100%;
      }

      .chapter {
        padding: 13px;
      }

      .read-chapter {
        padding: 7px 10px;
      }
    }
  </style>
</head>

<script type="module">

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


  import {
    getAuth,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence
  } from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    collection,
    query,
    where,
    getDocs,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  /* =========================
     Firebase
  ========================= */

  const firebaseConfig = {

    apiKey:
      "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

    authDomain:
      "noctyra-4b71b.firebaseapp.com",

    projectId:
      "noctyra-4b71b",

    storageBucket:
      "noctyra-4b71b.firebasestorage.app",

    messagingSenderId:
      "240877556023",

    appId:
      "1:240877556023:web:99529c91607902b8414ab2",

    measurementId:
      "G-DYP839YDNK"

  };


  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  setPersistence(
    auth,
    browserLocalPersistence
  ).catch(console.error);


  const OWNER_EMAIL =
    "nayaahead110@gmail.com";


  /* =========================
     Work ID
  ========================= */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const workId =
    params.get("id");


  /* =========================
     State
  ========================= */

  let currentUser = null;
  let currentWork = null;

  let liked = false;
  let favorite = false;
  let readLater = false;

  let allChapters = [];


  /* =========================
     Helpers
  ========================= */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function getImage(data, fields) {

    for (const field of fields) {

      if (
        data &&
        typeof data[field] === "string" &&
        data[field].trim()
      ) {

        return data[field];

      }

    }

    return "";

  }


  function getCategoryArray(work) {

    const categories =
      work.categories ||
      work.category ||
      work.genre ||
      [];


    if (Array.isArray(categories)) {

      return categories;

    }


    if (
      typeof categories === "string" &&
      categories.trim()
    ) {

      return categories
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);

    }


    return [];

  }


  function formatDate(timestamp) {

    if (!timestamp) {
      return "";
    }

    try {

      const date =
        timestamp.toDate
          ? timestamp.toDate()
          : new Date(timestamp);

      return date.toLocaleDateString(
        "ar-KW",
        {
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

    } catch {

      return "";

    }

  }


  /* =========================
     Menu
  ========================= */

  const menuButton =
    document.getElementById(
      "menuButton"
    );

  const closeMenu =
    document.getElementById(
      "closeMenu"
    );

  const sideMenu =
    document.getElementById(
      "sideMenu"
    );

  const menuOverlay =
    document.getElementById(
      "menuOverlay"
    );


  function openMenu() {

    sideMenu.classList.add("open");

    menuOverlay.classList.add("show");

  }


  function closeSideMenu() {

    sideMenu.classList.remove("open");

    menuOverlay.classList.remove("show");

  }


  menuButton.addEventListener(
    "click",
    openMenu
  );

  closeMenu.addEventListener(
    "click",
    closeSideMenu
  );

  menuOverlay.addEventListener(
    "click",
    closeSideMenu
  );


  document
    .querySelectorAll(".menu-links a")
    .forEach(link => {

      link.addEventListener(
        "click",
        closeSideMenu
      );

    });


  /* =========================
     Auth UI
  ========================= */

  const desktopAuthLink =
    document.getElementById(
      "desktopAuthLink"
    );

  const menuAuthLink =
    document.getElementById(
      "menuAuthLink"
    );

  const menuRegisterLink =
    document.getElementById(
      "menuRegisterLink"
    );

  const adminLink =
    document.getElementById(
      "adminLink"
    );

  const managementLink =
    document.getElementById(
      "managementLink"
    );


  onAuthStateChanged(
    auth,
    async user => {

      currentUser = user;


      if (user) {

        desktopAuthLink.textContent =
          "حسابي";

        desktopAuthLink.href =
          "account.html";


        menuAuthLink.textContent =
          "حسابي";

        menuAuthLink.href =
          "account.html";


        menuRegisterLink.style.display =
          "none";


        const email =
          (user.email || "")
            .trim()
            .toLowerCase();


        if (
          email ===
          OWNER_EMAIL.toLowerCase()
        ) {

          managementLink.style.display =
            "block";

          adminLink.style.display =
            "block";

        } else {

          managementLink.style.display =
            "none";

          adminLink.style.display =
            "none";

        }

      } else {

        desktopAuthLink.textContent =
          "تسجيل الدخول";

        desktopAuthLink.href =
          "login.html";


        menuAuthLink.textContent =
          "تسجيل الدخول";

        menuAuthLink.href =
          "login.html";


        menuRegisterLink.style.display =
          "block";

        managementLink.style.display =
          "none";

        adminLink.style.display =
          "none";

      }


      if (
        currentWork &&
        currentUser
      ) {

        await loadUserActions();

        updateActionButtons();

      }


      updateCommentUI();

    }
  );


  /* =========================
     Load Work
  ========================= */

  async function loadWork() {

    if (!workId) {

      showError(
        "لم يتم تحديد العمل",
        "الرابط لا يحتوي على معرّف العمل."
      );

      return;

    }


    try {

      const workRef =
        doc(
          db,
          "works",
          workId
        );


      const snapshot =
        await getDoc(workRef);


      if (!snapshot.exists()) {

        showError(
          "العمل غير موجود",
          "ربما تم حذف العمل أو أن الرابط غير صحيح."
        );

        return;

      }


      currentWork = {

        id: snapshot.id,

        ...snapshot.data()

      };


      await loadChapters();


      renderPage();


      if (currentUser) {

        await loadUserActions();

        updateActionButtons();

      }


      await loadComments();

    }

    catch (error) {

      console.error(
        "تعذر تحميل العمل:",
        error
      );


      showError(
        "تعذر تحميل العمل",
        error.message ||
        "حدث خطأ أثناء الاتصال بقاعدة البيانات."
      );

    }

  }


  /* =========================
     Render Page
  ========================= */

  function renderPage() {

    if (!currentWork) {
      return;
    }


    const work =
      currentWork;


    const title =
      work.title ||
      work.name ||
      "عمل بدون اسم";


    const originalName =
      work.originalName ||
      work.originalTitle ||
      "";


    const description =
      work.description ||

            .map(

      </section>


      <div class="container">


        <section

          <div class="section-head">

            <h2 class="section-title">

  /* =========================
     Chapters
  ========================= */

  async function loadChapters() {

    try {

      const chaptersQuery =
        query(
          collection(
            db,
            "chapters"
          ),
          where(
            "workId",
            "==",
            workId
          )
        );


      const snapshot =
        await getDocs(
          chaptersQuery
        );


      allChapters =
        snapshot.docs.map(
          docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          })
        );


      allChapters.sort(
        (a, b) => {

          const aNumber =
            Number(
              a.chapterNumber ??
              a.number ??
              a.chapter ??
              0
            );


          const bNumber =
            Number(
              b.chapterNumber ??
              b.number ??
              b.chapter ??
              0
            );


          return bNumber - aNumber;

        }
      );

    }

    catch (error) {

      console.error(
        "تعذر تحميل الفصول:",
        error
      );

      allChapters = [];

    }

  }


  function renderChapters() {

    const list =
      document.getElementById(
        "chaptersList"
      );


    if (!list) {
      return;
    }


    if (!allChapters.length) {

      list.innerHTML = `

        <div class="empty-box">
          لا توجد فصول منشورة لهذا العمل حاليًا.
        </div>

      `;

      return;

    }


    list.innerHTML =
      allChapters.map(
        chapter => {

          const number =
            chapter.chapterNumber ??
            chapter.number ??
            chapter.chapter ??
            "";


          const title =
            chapter.title ||
            (
              number
                ? `الفصل ${number}`
                : "فصل"
            );


          const date =
            formatDate(
              chapter.createdAt ||
              chapter.publishedAt ||
              chapter.updatedAt
            );


          const chapterUrl =
            chapter.url ||
            chapter.readerUrl ||
            chapter.readUrl ||
            chapter.link ||
            "";


          return `

            <div class="chapter">

              <div class="chapter-left">

                <div class="chapter-name">
                  ${escapeHtml(title)}
                </div>

                ${
                  date
                    ? `
                      <div class="chapter-meta">
                        ${escapeHtml(date)}
                      </div>
                    `
                    : ""
                }

              </div>


              ${
                chapterUrl
                  ? `
                    <a
                      class="read-chapter"
                      href="${escapeHtml(chapterUrl)}"
                    >
                      قراءة
                    </a>
                  `
                  : `
                    <span
                      class="read-chapter"
                      style="opacity:.5;"
                    >
                      قريبًا
                    </span>
                  `
              }

            </div>

          `;

        }
      ).join("");

  }

  async function loadUserActions() {

    if (
      !currentUser ||
      !currentWork
    ) {

      return;

    }


    try {

      const userId =
        currentUser.uid;


      /*
        IMPORTANT:

        workLikes:
        workLikes/{workId}_{uid}

        favorites:
        favorites/{uid}/works/{workId}

        readLater:
        readLater/{uid}/works/{workId}
      */


      const likeRef =
        doc(
          db,
          "workLikes",
          `${workId}_${userId}`
        );


      const favoriteRef =
        doc(
          db,
          "favorites",
          userId,
          "works",
          workId
        );


      const laterRef =
        doc(
          db,
          "readLater",
          userId,
          "works",
          workId
        );


      const [
        likeSnap,
        favoriteSnap,
        laterSnap
      ] = await Promise.all([

        getDoc(likeRef),

        getDoc(favoriteRef),

        getDoc(laterRef)

      ]);


      liked =
        likeSnap.exists();


      favorite =
        favoriteSnap.exists();


      readLater =
        laterSnap.exists();


      await updateLikeCount();

    }

    catch (error) {

      console.error(
        "تعذر تحميل تفاعلات المستخدم:",
        error
      );

    }

  }


  async function getLikeCount() {

    const likesQuery =
      query(
        collection(
          db,
          "workLikes"
        ),
        where(
          "workId",
          "==",
          workId
        )
      );


    const snapshot =
      await getDocs(
        likesQuery
      );


    return snapshot.size;

  }

    try {

        await getLikeCount();


      const countElement =
        document.getElementById(
          "likeCount"
        );


      if (countElement) {

        countElement.textContent =

      }

    }

    catch (error) {

      console.error(

    }

  function setupActionButtons() {

    const likeButton =

    const favoriteButton =

        "favoriteButton"
      );

    const laterButton =
      document.getElementById(
        "laterButton"
      );

    ) {

    }


    updateActionButtons();


    likeButton.addEventListener(

      toggleLike
    );


    favoriteButton.addEventListener(
      "click",
      toggleFavorite
    );


    laterButton.addEventListener(
      "click",
      toggleReadLater
    );

  }


  function updateActionButtons() {

    const likeButton =
      document.getElementById(
        "likeButton"
      );

    const favoriteButton =
      document.getElementById(
        "favoriteButton"
      );

    const laterButton =
      document.getElementById(
        "laterButton"
      );


    if (
      !likeButton ||
      !favoriteButton ||
      !laterButton
    ) {

      return;

    }


    likeButton.classList.toggle(
      "active",
      liked
    );


    likeButton.innerHTML =
      `${liked ? "♥" : "♡"} أعجبني
       <span id="likeCount">0</span>`;


    favoriteButton.classList.toggle(
      "active",
      favorite
    );


    favoriteButton.textContent =
      favorite
        ? "★ في المفضلة"
        : "☆ المفضلة";


    laterButton.classList.toggle(
      "active",
      readLater
    );


    laterButton.textContent =
      readLater
        ? "✓ في اقرأ لاحقًا"
        : "🔖 اقرأ لاحقًا";


    updateLikeCount();

  }

    );


    window.location.href =

  /* =========================
     LIKE
  ========================= */

  async function toggleLike() {

    if (
      !(await requireLogin())
    ) {

      return;

    }


    const button =
      document.getElementById(
        "likeButton"
      );


    if (!button) {
      return;
    }


    button.disabled = true;


    try {

      const likeId =
        `${workId}_${currentUser.uid}`;


      const likeRef =
        doc(
          db,
          "workLikes",
          likeId
        );


      if (liked) {

        await deleteDoc(
          likeRef
        );

        liked = false;

      } else {

        await setDoc(
          likeRef,
          {
            workId: workId,

            uid:
              currentUser.uid,

            createdAt:
              serverTimestamp()
          }
        );

        liked = true;

      }


      updateActionButtons();

    }

    catch (error) {

      console.error(
        "خطأ الإعجاب:",
        error.code,
        error.message,
        error
      );


      alert(
        "تعذر تحديث الإعجاب:\n\n" +
        (error.message ||
          "خطأ غير معروف")
      );

    }

    finally {

      button.disabled = false;

    }

  }

  /* =========================
     Comments UI
  ========================= */

  function updateCommentUI() {

    const loginBox =
      document.getElementById(
        "commentLogin"
      );

    const form =
      document.getElementById(
        "commentForm"
      );


    if (
      !loginBox ||
      !form
    ) {

    if (currentUser) {

      form.style.display =

  /* =========================
     Public Profile
  ========================= */

  async function getPublicProfile() {

    if (!currentUser) {
      return {};
    }


    try {

      const profileRef =
        doc(
          db,
          "publicProfiles",
          currentUser.uid
        );


      const snapshot =
        await getDoc(
          profileRef
        );


      if (snapshot.exists()) {

        return snapshot.data();

      }

    }

    catch (error) {

      console.error(
        "تعذر تحميل الملف العام:",
        error
      );

    }


    return {};

  }


  /* =========================
     Submit Comment
  ========================= */

  async function submitComment(event) {

    event.preventDefault();


    if (!currentUser) {
      return;
    }


    const input =
      document.getElementById(
        "commentInput"
      );


    const submit =
      document.getElementById(
        "commentSubmit"
      );


    const text =
      input.value.trim();


    if (!text) {

      alert(
        "اكتب تعليقًا أولًا."
      );

      return;

    }


    if (text.length > 1000) {

      alert(
        "التعليق طويل جدًا."
      );

      return;

    }


    submit.disabled = true;

    submit.textContent =
      "جاري النشر...";


    try {

      const profile =
        await getPublicProfile();


      const username =
        profile.username ||
        profile.displayName ||
        currentUser.displayName ||
        "مستخدم";


      const avatar =
        getImage(
          profile,
          [
            "avatar",
            "avatarUrl",
            "photoURL",
            "photoUrl"
          ]
        ) ||
        currentUser.photoURL ||
        "";


      /*
        IMPORTANT:
        Rules use workComments
        and uid
      */


      const commentRef =
        doc(
          collection(
            db,
            "workComments"
          )
        );


      await setDoc(
        commentRef,
        {
          workId: workId,

          uid:
            currentUser.uid,

          username:
            username,

          avatar:
            avatar,

          text:
            text,

          createdAt:
            serverTimestamp()
        }
      );


      input.value =
        "";


      await loadComments();

    }

    catch (error) {

      console.error(
        "تعذر نشر التعليق:",
        error
      );


      alert(
        "تعذر نشر التعليق:\n\n" +
        (error.message ||
          "خطأ غير معروف")
      );

    }

    finally {

      submit.disabled = false;

      submit.textContent =
        "نشر التعليق";

    }

  }


  /* =========================
     Load Comments
  ========================= */

  async function loadComments() {

    const list =
      document.getElementById(
        "commentsList"
      );


    if (!list) {
      return;
    }


    try {

      const commentsQuery =
        query(
          collection(
            db,
            "workComments"
          ),
          where(
            "workId",
            "==",
            workId
          )
        );


      const snapshot =
        await getDocs(
          commentsQuery
        );


      const comments =
        snapshot.docs.map(
          docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          })
        );


      comments.sort(
        (a, b) => {

          const aTime =
            a.createdAt?.seconds ||
            0;

          const bTime =
            b.createdAt?.seconds ||
            0;

          return bTime - aTime;

        }
      );


      if (!comments.length) {

        list.innerHTML = `

          <div class="empty-box">
            لا توجد تعليقات حتى الآن.
          </div>

        `;

        return;

      }


      list.innerHTML =
        comments.map(
          comment => {

            const username =
              comment.username ||
              "مستخدم";


            const avatar =
              comment.avatar ||
              "";


            const date =
              formatDate(
                comment.createdAt
              );


            const canDelete =
              currentUser &&
              currentUser.uid ===
              comment.uid;


            return `

              <article class="comment">

                ${
                  canDelete
                    ? `
                      <button
                        type="button"
                        class="delete-comment"
                        data-comment-id="${escapeHtml(comment.id)}"
                      >
                        حذف
                      </button>
                    `
                    : ""
                }


                <div class="comment-top">

                  ${
                    avatar
                      ? `
                        <img
                          class="comment-avatar"
                          src="${escapeHtml(avatar)}"
                          alt=""
                        >
                      `
                      : `
                        <div
                          class="comment-avatar comment-avatar-empty"
                        >
                          👤
                        </div>
                      `
                  }


                  <div>

                    <div class="comment-user">
                      ${escapeHtml(username)}
                    </div>

                    ${
                      date
                        ? `
                          <div class="comment-date">
                            ${escapeHtml(date)}
                          </div>
                        `
                        : ""
                    }

                  </div>

                </div>


                <div class="comment-text">
                  ${escapeHtml(comment.text)}
                </div>

              </article>

            `;

          }
        ).join("");


      document
        .querySelectorAll(
          ".delete-comment"
        )
        .forEach(button => {

          button.addEventListener(
            "click",
            () =>
              deleteComment(
                button.dataset.commentId
              )
          );

        });

    }

    catch (error) {

      console.error(
        "تعذر تحميل التعليقات:",
        error
      );


      list.innerHTML = `

        <div class="empty-box">
          تعذر تحميل التعليقات حاليًا.
        </div>

      `;

    }

  }


  /* =========================
     Delete Comment
  ========================= */

  async function deleteComment(
    commentId
  ) {

    if (!currentUser) {
      return;
    }


    if (
      !confirm(
        "هل تريد حذف تعليقك؟"
      )
    ) {

      return;

    }


    try {

      const commentRef =
        doc(
          db,
          "workComments",
          commentId
        );


      const snapshot =
        await getDoc(
          commentRef
        );


      if (!snapshot.exists()) {
        return;
      }


      const data =
        snapshot.data();


      if (
        data.uid !==
        currentUser.uid
      ) {

        alert(
          "لا يمكنك حذف هذا التعليق."
        );

        return;

      }


      await deleteDoc(
        commentRef
      );


      await loadComments();

    }

    catch (error) {

      console.error(
        "تعذر حذف التعليق:",
        error
      );


      alert(
        "تعذر حذف التعليق:\n\n" +
        (error.message ||
          "خطأ غير معروف")
      );

    }

  }
