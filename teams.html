<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الفرق | Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #09090c;
      color: #eeeeee;
      font-family: Arial, sans-serif;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    /* =========================
       الهيدر
    ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 9, 12, 0.94);
      border-bottom: 1px solid #222229;
      backdrop-filter: blur(12px);
    }

    .nav {
      max-width: 1100px;
      margin: auto;
      min-height: 70px;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .logo span {
      color: #8d6bb5;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 25px;
      color: #9999a3;
      font-size: 14px;
    }

    .nav-links a {
      transition: 0.2s;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    .menu-btn {
      background: none;
      border: 0;
      color: #eeeeee;
      font-size: 27px;
      cursor: pointer;
      padding: 5px;
      line-height: 1;
    }

    /* =========================
       القائمة
    ========================= */

    .side-menu {
      position: fixed;
      top: 0;
      right: -330px;

      width: 310px;
      max-width: 85%;
      height: 100vh;

      background: #0d0c11;
      border-left: 1px solid #29242f;

      z-index: 1000;

      padding: 25px;

      transition: right 0.3s ease;

      box-shadow: -20px 0 60px rgba(0, 0, 0, 0.45);
    }

    .side-menu.open {
      right: 0;
    }

    .menu-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding-bottom: 22px;
      margin-bottom: 20px;

      border-bottom: 1px solid #25212b;
    }

    .menu-title {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    .close-menu {
      background: none;
      border: 0;
      color: #77727d;
      font-size: 27px;
      cursor: pointer;
    }

    .menu-links {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .menu-links a {
      display: block;
      padding: 14px 15px;
      color: #aaa6b0;
      border-radius: 7px;
      font-size: 14px;
      transition: 0.2s;
    }

    .menu-links a:hover {
      background: #17141c;
      color: #ffffff;
      padding-right: 20px;
    }

    .menu-divider {
      height: 1px;
      background: #25212b;
      margin: 15px 0;
    }

    .menu-login {
      color: #9b72bd !important;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.55);

      z-index: 999;

      opacity: 0;
      visibility: hidden;

      transition: 0.3s;
    }

    .menu-overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* =========================
       المحتوى
    ========================= */

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 80px 24px;
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 25px;

      margin-bottom: 40px;
    }

    .page-title {
      font-size: 38px;
      margin-bottom: 7px;
    }

    .page-subtitle {
      color: #777781;
      font-size: 14px;
    }

    /* =========================
       زر إنشاء فريق
    ========================= */

    .create-btn {
      border: 1px solid #8d6bb5;
      background: #17121d;
      color: #d6b9ed;

      padding: 12px 20px;

      border-radius: 6px;

      cursor: pointer;

      font-size: 14px;
      font-weight: bold;

      transition: 0.2s;
      white-space: nowrap;
    }

    .create-btn:hover {
      background: #21192a;
      border-color: #b28bd4;
      transform: translateY(-2px);
    }

    /* =========================
       شبكة الفرق
    ========================= */

    .teams-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fill,
          minmax(250px, 1fr)
        );

      gap: 18px;
    }

    .team-card {
      background: #101015;

      border: 1px solid #222229;

      border-radius: 9px;

      overflow: hidden;

      transition: 0.2s;
    }

    .team-card:hover {
      border-color: #70528d;
      transform: translateY(-3px);
    }

    .team-image {
      width: 100%;
      height: 170px;

      object-fit: cover;

      display: block;

      background:
        radial-gradient(
          circle at center,
          #21182d,
          #0d0d11
        );

      border-bottom: 1px solid #222229;
    }

    .team-image-placeholder {
      width: 100%;
      height: 170px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 38px;
      color: #71548f;

      background:
        radial-gradient(
          circle at center,
          #21182d,
          #0d0d11
        );

      border-bottom: 1px solid #222229;
    }

    .team-content {
      padding: 17px;
    }

    .team-name {
      font-size: 18px;
      font-weight: bold;

      margin-bottom: 5px;
    }

    .team-description {
      color: #777781;
      font-size: 13px;

      min-height: 44px;

      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .team-members {
      margin-top: 15px;

      color: #918d98;
      font-size: 12px;
    }

    /* =========================
       لا توجد فرق
    ========================= */

    .empty-teams {
      min-height: 280px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      background: #101015;

      border: 1px solid #222229;

      border-radius: 8px;

      padding: 40px 20px;
    }

    .empty-icon {
      font-size: 30px;
      color: #71548f;
      margin-bottom: 15px;
    }

    .empty-teams h3 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .empty-teams p {
      color: #777781;
      font-size: 14px;
    }

    /* =========================
       النافذة
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0, 0, 0, 0.72);

      z-index: 2000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 500px;

      background: #0f0e13;

      border: 1px solid #2b2533;

      border-radius: 10px;

      padding: 25px;

      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 25px;
    }

    .modal-title {
      font-size: 21px;
      font-weight: bold;
    }

    .close-modal {
      background: none;
      border: 0;

      color: #77727d;

      font-size: 26px;

      cursor: pointer;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;

      color: #aaa6b0;

      font-size: 13px;

      margin-bottom: 7px;
    }

    .required {
      color: #a77ac7;
    }

    .form-input,
    .form-textarea {
      width: 100%;

      background: #09090c;

      border: 1px solid #292631;

      border-radius: 7px;

      padding: 12px 13px;

      color: #eeeeee;

      outline: none;

      font-size: 14px;

      transition: 0.2s;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: #8d6bb5;
    }

    .form-textarea {
      min-height: 110px;
      resize: vertical;
    }

    .image-preview {
      width: 100%;
      height: 130px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-top: 10px;

      border: 1px dashed #38313f;

      border-radius: 7px;

      color: #68636e;
      font-size: 13px;

      overflow: hidden;

      background: #0a0a0d;
    }

    .image-preview img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .modal-actions {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      margin-top: 25px;
    }

    .cancel-btn,
    .submit-btn {
      padding: 11px 19px;

      border-radius: 6px;

      cursor: pointer;

      font-size: 13px;

      transition: 0.2s;
    }

    .cancel-btn {
      background: transparent;

      border: 1px solid #292631;

      color: #8e8994;
    }

    .cancel-btn:hover {
      color: #ffffff;
      border-color: #45404d;
    }

    .submit-btn {
      background: #eeeeee;

      border: 1px solid #eeeeee;

      color: #09090c;

      font-weight: bold;
    }

    .submit-btn:hover {
      background: transparent;
      color: #eeeeee;
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* =========================
       رسائل
    ========================= */

    .message {
      display: none;

      padding: 12px 14px;

      border-radius: 7px;

      font-size: 13px;

      margin-bottom: 18px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: rgba(130, 50, 70, 0.15);
      border: 1px solid rgba(160, 70, 90, 0.35);
      color: #dca6b2;
    }

    .message.success {
      background: rgba(70, 120, 100, 0.12);
      border: 1px solid rgba(80, 140, 110, 0.3);
      color: #a8d0bc;
    }

    /* =========================
       الفوتر
    ========================= */

    .footer {
      border-top: 1px solid #222229;

      padding: 45px 24px;

      text-align: center;

      color: #666670;
    }

    .footer-logo {
      color: #eeeeee;

      font-weight: bold;

      letter-spacing: 5px;

      margin-bottom: 10px;
    }

    .footer p {
      font-size: 12px;
    }

    /* =========================
       الجوال
    ========================= */

    @media (max-width: 700px) {

      .nav {
        min-height: 65px;
        padding: 0 18px;
      }

      .nav-links {
        display: none;
      }

      .container {
        padding: 65px 20px;
      }

      .page-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .page-title {
        font-size: 30px;
      }

      .create-btn {
        width: 100%;
      }

      .teams-grid {
        grid-template-columns: 1fr;
      }

    }
  </style>
</head>


<body>

  <!-- =========================
       الهيدر
  ========================= -->

  <header class="header">

    <nav class="nav">

      <a href="index.html" class="logo">
        NOCTYRA<span>.</span>
      </a>

      <div class="nav-links">

        <a href="index.html">
          الرئيسية
        </a>

        <a href="index.html#library">
          المكتبة
        </a>

        <a href="teams.html">
          الفرق
        </a>

        <a
          href="login.html"
          id="authLink"
        >
          تسجيل الدخول
        </a>

      </div>

      <button
        class="menu-btn"
        id="menuButton"
        type="button"
      >
        ☰
      </button>

    </nav>

  </header>


  <!-- =========================
       القائمة الجانبية
  ========================= -->

  <div
    class="menu-overlay"
    id="menuOverlay"
  ></div>


  <aside
    class="side-menu"
    id="sideMenu"
  >

    <div class="menu-header">

      <div class="menu-title">
        NOCTYRA
      </div>

      <button
        class="close-menu"
        id="closeMenu"
        type="button"
      >
        ×
      </button>

    </div>


    <nav class="menu-links">

      <a href="index.html">
        الرئيسية
      </a>

      <a href="index.html#library">
        الأعمال
      </a>

      <a href="index.html#about">
        عن Noctyra
      </a>

      <div class="menu-divider"></div>

      <a href="submit.html">
        طلب نشر عمل
      </a>

      <a
        href="login.html"
        id="menuAuthLink"
        class="menu-login"
      >
        تسجيل الدخول
      </a>

      <a
        href="login.html"
        id="menuRegisterLink"
      >
        إنشاء حساب
      </a>

      <div class="menu-divider"></div>

      <a href="teams.html">
        الفرق
      </a>

    </nav>

  </aside>


  <!-- =========================
       المحتوى
  ========================= -->

  <main>

    <section class="container">

      <div class="page-head">

        <div>

          <h1 class="page-title">
            الفرق
          </h1>

          <p class="page-subtitle">
            اجتمعوا، ترجموا، واصنعوا حكاياتكم معًا.
          </p>

        </div>


        <button
          class="create-btn"
          id="createTeamButton"
          type="button"
        >
          + إنشاء فريق
        </button>

      </div>


      <div
        class="teams-grid"
        id="teamsGrid"
      ></div>


      <div
        class="empty-teams"
        id="emptyTeams"
        style="display:none;"
      >

        <div class="empty-icon">
          ✦
        </div>

        <h3>
          لا توجد فرق حتى الآن
        </h3>

        <p>
          كن أول من ينشئ فريقًا في Noctyra.
        </p>

      </div>

    </section>

  </main>


  <!-- =========================
       نافذة إنشاء فريق
  ========================= -->

  <div
    class="modal-overlay"
    id="modalOverlay"
  >

    <div class="modal">

      <div class="modal-header">

        <div class="modal-title">
          إنشاء فريق
        </div>

        <button
          class="close-modal"
          id="closeModal"
          type="button"
        >
          ×
        </button>

      </div>


      <div
        class="message"
        id="formMessage"
      ></div>


      <form id="teamForm">

        <div class="form-group">

          <label
            class="form-label"
            for="teamName"
          >
            اسم الفريق
            <span class="required">*</span>
          </label>

          <input
            type="text"
            id="teamName"
            class="form-input"
            maxlength="60"
            required
            placeholder="اكتب اسم الفريق"
          >

        </div>


        <div class="form-group">

          <label
            class="form-label"
            for="teamImage"
          >
            صورة الفريق
          </label>

          <input
            type="file"
            id="teamImage"
            class="form-input"
            accept="image/*"
          >

          <div
            class="image-preview"
            id="imagePreview"
          >
            معاينة صورة الفريق
          </div>

        </div>


        <div class="form-group">

          <label
            class="form-label"
            for="teamDescription"
          >
            نبذة الفريق
          </label>

          <textarea
            id="teamDescription"
            class="form-textarea"
            maxlength="500"
            placeholder="اكتب نبذة قصيرة عن الفريق..."
          ></textarea>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            class="cancel-btn"
            id="cancelButton"
          >
            إلغاء
          </button>

          <button
            type="submit"
            class="submit-btn"
            id="submitButton"
          >
            إنشاء الفريق
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- =========================
       JavaScript
  ========================= -->

  <script type="module">

    /* =========================
       Firebase
    ========================= */

    import {
      initializeApp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getAuth,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      serverTimestamp
    }
    from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       إعداد Firebase
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

      authDomain:
        "noctyra-4b71b.firebaseapp.com",

      projectId:
        "noctyra-4b71b",

      storageBucket:
        "noctyra-4b71b.firebasestorage.app",

      messagingSenderId:
        "240877556023",

      appId:
        "1:240877556023:web:99529c91607902b8414ab2",

      measurementId:
        "G-DYP839YDNK"

    };


    const app =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(app);


    const db =
      getFirestore(app);


    setPersistence(
      auth,
      browserLocalPersistence
    ).catch(
      (error) => {
        console.error(
          "تعذر حفظ جلسة الدخول:",
          error
        );
      }
    );


    /* =========================
       عناصر الصفحة
    ========================= */

    const teamsGrid =
      document.getElementById(
        "teamsGrid"
      );


    const emptyTeams =
      document.getElementById(
        "emptyTeams"
      );


    const createTeamButton =
      document.getElementById(
        "createTeamButton"
      );


    const authLink =
      document.getElementById(
        "authLink"
      );


    const menuAuthLink =
      document.getElementById(
        "menuAuthLink"
      );


    const menuRegisterLink =
      document.getElementById(
        "menuRegisterLink"
      );


    const modalOverlay =
      document.getElementById(
        "modalOverlay"
      );


    const closeModal =
      document.getElementById(
        "closeModal"
      );


    const cancelButton =
      document.getElementById(
        "cancelButton"
      );


    const teamForm =
      document.getElementById(
        "teamForm"
      );


    const teamName =
      document.getElementById(
        "teamName"
      );


    const teamImage =
      document.getElementById(
        "teamImage"
      );


    const teamDescription =
      document.getElementById(
        "teamDescription"
      );


    const imagePreview =
      document.getElementById(
        "imagePreview"
      );


    const formMessage =
      document.getElementById(
        "formMessage"
      );


    const submitButton =
      document.getElementById(
        "submitButton"
      );


    /* =========================
       القائمة
    ========================= */

    const menuButton =
      document.getElementById(
        "menuButton"
      );


    const closeMenu =
      document.getElementById(
        "closeMenu"
      );


    const sideMenu =
      document.getElementById(
        "sideMenu"
      );


    const menuOverlay =
      document.getElementById(
        "menuOverlay"
      );


    function openMenu() {

      sideMenu.classList.add(
        "open"
      );

      menuOverlay.classList.add(
        "show"
      );

    }


    function closeSideMenu() {

      sideMenu.classList.remove(
        "open"
      );

      menuOverlay.classList.remove(
        "show"
      );

    }


    menuButton.addEventListener(
      "click",
      openMenu
    );


    closeMenu.addEventListener(
      "click",
      closeSideMenu
    );


    menuOverlay.addEventListener(
      "click",
      closeSideMenu
    );


    document
      .querySelectorAll(".menu-links a")
      .forEach(
        (link) => {

          link.addEventListener(
            "click",
            closeSideMenu
          );

        }
      );


    /* =========================
       المستخدم الحالي
    ========================= */

    let currentUser = null;


    onAuthStateChanged(
      auth,
      async (user) => {

        currentUser = user;


        if (user) {

          authLink.textContent =
            "حسابي";

          authLink.href =
            "account.html";


          menuAuthLink.textContent =
            "حسابي";

          menuAuthLink.href =
            "account.html";


          menuRegisterLink.style.display =
            "none";

          createTeamButton.style.display =
            "block";

        }

        else {

          authLink.textContent =
            "تسجيل الدخول";

          authLink.href =
            "login.html";


          menuAuthLink.textContent =
            "تسجيل الدخول";

          menuAuthLink.href =
            "login.html";


          menuRegisterLink.style.display =
            "block";

          createTeamButton.style.display =
            "block";

        }


        await loadTeams();

      }
    );


    /* =========================
       أدوات
    ========================= */

    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function getProfileName(user) {

      if (!user) {
        return "مستخدم";
      }

      return (
        user.displayName ||
        user.email?.split("@")[0] ||
        "مستخدم"
      );

    }


    /* =========================
       تحميل الفرق
    ========================= */

    async function loadTeams() {

      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "teams"
            )
          );


        const teams =
          snapshot.docs.map(
            (docSnap) => {

              return {
                id: docSnap.id,
                ...docSnap.data()
              };

            }
          );


        renderTeams(teams);

      }

      catch (error) {

        console.error(
          "تعذر تحميل الفرق:",
          error
        );

        teamsGrid.innerHTML = "";

        emptyTeams.style.display =
          "flex";

      }

    }


    /* =========================
       عرض الفرق
    ========================= */

    function renderTeams(teams) {

      if (
        teams.length === 0
      ) {

        teamsGrid.innerHTML =
          "";

        teamsGrid.style.display =
          "none";

        emptyTeams.style.display =
          "flex";

        return;

      }


      emptyTeams.style.display =
        "none";

      teamsGrid.style.display =
        "grid";


      teamsGrid.innerHTML =
        teams.map(
          (team) => {

            const name =
              team.name ||
              "فريق بدون اسم";


            const description =
              team.description ||
              "لا توجد نبذة عن الفريق.";


            const image =
              team.image ||
              team.imageUrl ||
              "";


            const members =
              Array.isArray(
                team.members
              )
                ? team.members.length
                : 1;


            return `

              <a
                class="team-card"
                href="team.html?id=${encodeURIComponent(team.id)}"
              >

                ${
                  image
                    ? `
                      <img
                        class="team-image"
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(name)}"
                      >
                    `
                    : `
                      <div
                        class="team-image-placeholder"
                      >
                        ✦
                      </div>
                    `
                }

                <div class="team-content">

                  <div class="team-name">
                    ${escapeHtml(name)}
                  </div>

                  <div class="team-description">
                    ${escapeHtml(description)}
                  </div>

                  <div class="team-members">
                    👥 ${members} عضو
                  </div>

                </div>

              </a>

            `;

          }
        )
        .join("");

    }


    /* =========================
       فتح النافذة
    ========================= */

    createTeamButton.addEventListener(
      "click",
      () => {

        if (!currentUser) {

          window.location.href =
            "login.html";

          return;

        }


        clearMessage();

        modalOverlay.classList.add(
          "show"
        );

        teamName.focus();

      }
    );


    function closeModalWindow() {

      modalOverlay.classList.remove(
        "show"
      );

      teamForm.reset();

      imagePreview.innerHTML =
        "معاينة صورة الفريق";

      clearMessage();

    }


    closeModal.addEventListener(
      "click",
      closeModalWindow
    );


    cancelButton.addEventListener(
      "click",
      closeModalWindow
    );


    modalOverlay.addEventListener(
      "click",
      (event) => {

        if (
          event.target ===
          modalOverlay
        ) {

          closeModalWindow();

        }

      }
    );


    /* =========================
       معاينة الصورة
    ========================= */

    teamImage.addEventListener(
      "change",
      () => {

        const file =
          teamImage.files?.[0];


        if (!file) {

          imagePreview.innerHTML =
            "معاينة صورة الفريق";

          return;

        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          teamImage.value = "";

          imagePreview.innerHTML =
            "الملف المختار ليس صورة.";

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          (event) => {

            imagePreview.innerHTML = `

              <img
                src="${event.target.result}"
                alt="معاينة"
              >

            `;

          };


        reader.readAsDataURL(file);

      }
    );


    /* =========================
       الرسائل
    ========================= */

    function showMessage(
      text,
      type
    ) {

      formMessage.textContent =
        text;

      formMessage.className =
        "message show " +
        type;

    }


    function clearMessage() {

      formMessage.textContent =
        "";

      formMessage.className =
        "message";

    }


    /* =========================
       إنشاء الفريق
    ========================= */

    teamForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        if (!currentUser) {

          window.location.href =
            "login.html";

          return;

        }


        const name =
          teamName.value.trim();


        const description =
          teamDescription.value.trim();


        if (!name) {

          showMessage(
            "اكتب اسم الفريق أولًا.",
            "error"
          );

          return;

        }


        submitButton.disabled =
          true;

        submitButton.textContent =
          "جاري إنشاء الفريق...";


        try {

          /*
            ملاحظة:
            الصورة هنا يتم تخزينها كـ Data URL.
            هذا مناسب للنسخة الأولية،
            وبعدها نربط Firebase Storage
            لرفع الصور بشكل أفضل.
          */

          let imageData = "";


          const file =
            teamImage.files?.[0];


          if (file) {

            if (
              file.size >
              2 * 1024 * 1024
            ) {

              throw new Error(
                "حجم صورة الفريق يجب أن يكون أقل من 2MB."
              );

            }


            imageData =
              await readFileAsDataURL(
                file
              );

          }


          const creatorName =
            getProfileName(
              currentUser
            );


          /*
            القائد يتم إضافته
            تلقائيًا عند إنشاء الفريق.
          */

          const leader = {

            uid:
              currentUser.uid,

            name:
              creatorName,

            email:
              currentUser.email || "",

            role:
              "leader",

            joinedAt:
              new Date().toISOString()

          };


          const teamData = {

            name:
              name,

            description:
              description,

            image:
              imageData,

            ownerId:
              currentUser.uid,

            ownerName:
              creatorName,

            members:
              [
                leader
              ],

            works:
              [],

            createdAt:
              serverTimestamp()

          };


          const teamRef =
            await addDoc(
              collection(
                db,
                "teams"
              ),
              teamData
            );


          showMessage(
            "تم إنشاء الفريق بنجاح.",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                `team.html?id=${encodeURIComponent(teamRef.id)}`;

            },
            700
          );

        }

        catch (error) {

          console.error(
            "خطأ في إنشاء الفريق:",
            error
          );


          showMessage(
            error.message ||
            "حدث خطأ أثناء إنشاء الفريق.",
            "error"
          );


          submitButton.disabled =
            false;

          submitButton.textContent =
            "إنشاء الفريق";

        }

      }
    );


    /* =========================
       تحويل الصورة
    ========================= */

    function readFileAsDataURL(
      file
    ) {

      return new Promise(
        (
          resolve,
          reject
        ) => {

          const reader =
            new FileReader();


          reader.onload =
            () => {

              resolve(
                reader.result
              );

            };


          reader.onerror =
            () => {

              reject(
                new Error(
                  "تعذر قراءة الصورة."
                )
              );

            };


          reader.readAsDataURL(
            file
          );

        }
      );

    }

  </script>

</body>

  </html>
