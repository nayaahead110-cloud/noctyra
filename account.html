<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي - Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08070b;
      color: #eeeeee;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 7px;
      margin-bottom: 25px;
    }

    .logo span {
      color: #9b72bd;
    }

    .box {
      background: #111015;
      border: 1px solid #2b2632;
      border-radius: 12px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .star {
      color: #9b72bd;
      font-size: 35px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .welcome {
      color: #77727d;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .email {
      background: #09080c;
      border: 1px solid #302a36;
      border-radius: 7px;
      padding: 15px;
      color: #b994cf;
      font-size: 14px;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .logout {
      width: 100%;
      padding: 14px;
      border: 1px solid #eeeeee;
      border-radius: 7px;
      background: #eeeeee;
      color: #09080c;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .logout:hover {
      background: transparent;
      color: #eeeeee;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #6f6875;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #9b72bd;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      NOCTYRA<span>.</span>
    </div>

    <div class="box">

      <div class="star">✦</div>

      <h1>حسابي</h1>

      <p class="welcome">
        مرحبًا بك في Noctyra
      </p>

      <div class="email" id="email">
        جاري تحميل الحساب...
      </div>

      <button class="logout" id="logout">
        تسجيل الخروج
      </button>

      <a class="back" href="index.html">
        ← العودة إلى الرئيسية
      </a>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",
      authDomain: "noctyra-4b71b.firebaseapp.com",
      projectId: "noctyra-4b71b",
      storageBucket: "noctyra-4b71b.firebasestorage.app",
      messagingSenderId: "240877556023",
      appId: "1:240877556023:web:99529c91607902b8414ab2"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const email = document.getElementById("email");
    const logout = document.getElementById("logout");


    onAuthStateChanged(auth, function(user) {

      if (user) {

        email.textContent = user.email;

      } else {

        email.textContent = "لم يتم تسجيل الدخول";
        logout.style.display = "none";

      }

    });


    logout.addEventListener("click", async function() {

      try {

        await signOut(auth);

        window.location.href = "login.html";

      } catch (error) {

        console.error(error);

        alert("حدث خطأ أثناء تسجيل الخروج.");

      }

    });

  </script>

</body>
</html>
