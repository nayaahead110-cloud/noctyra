<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noctyra - تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, rgba(110, 50, 160, 0.18), transparent 35%),
        linear-gradient(135deg, #07070b, #100914, #08080c);
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: rgba(16, 12, 22, 0.95);
      border: 1px solid rgba(170, 110, 220, 0.18);
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 3px;
      color: #d5b0ff;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #8d8794;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      background: #0b0a0f;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 25px;
    }

    .tab {
      flex: 1;
      border: none;
      background: transparent;
      color: #888;
      padding: 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .tab.active {
      background: #21152b;
      color: #d8b5ff;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #bcb5c4;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid #29212f;
      outline: none;
      background: #0b090e;
      color: white;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #8652b5;
      box-shadow: 0 0 0 2px rgba(134, 82, 181, 0.1);
    }

    .avatar-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .avatar-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #6f478e;
      background: #0b090e;
      margin-bottom: 10px;
    }

    .avatar-label {
      cursor: pointer;
      color: #c59af0;
      font-size: 13px;
    }

    .avatar-label:hover {
      color: #dfc2ff;
    }

    #registerAvatar {
      display: none;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #74449b, #4b2867);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .btn:hover {
      filter: brightness(1.12);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      min-height: 20px;
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }

    .success {
      color: #9ed9b2;
    }

    .error {
      color: #e89a9a;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #77717e;
      text-decoration: none;
      font-size: 12px;
    }

    .back:hover {
      color: #b997d4;
    }

    @media (max-width: 480px) {
      .container {
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">NOCTYRA</div>
    <div class="subtitle">مرحبًا بك في عالم Noctyra</div>

    <div class="tabs">
      <button class="tab active" id="loginTab">تسجيل الدخول</button>
      <button class="tab" id="registerTab">إنشاء حساب</button>
    </div>

    <!-- تسجيل الدخول -->
    <form class="form active" id="loginForm">

      <div class="field">
        <label for="loginEmail">البريد الإلكتروني</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="أدخل بريدك الإلكتروني"
          required
        >
      </div>

      <div class="field">
        <label for="loginPassword">كلمة المرور</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="أدخل كلمة المرور"
          required
        >
      </div>

      <button class="btn" type="submit" id="loginBtn">
        تسجيل الدخول
      </button>

      <div class="message" id="loginMessage"></div>

    </form>


    <!-- إنشاء حساب -->
    <form class="form" id="registerForm">

      <div class="avatar-box">

        <img
          class="avatar-preview"
          id="avatarPreview"
          src="https://ui-avatars.com/api/?name=Noctyra&background=160f1d&color=d8b5ff&size=200"
          alt="الصورة الشخصية"
        >

        <label class="avatar-label" for="registerAvatar">
          اختيار صورة شخصية
        </label>

        <input
          type="file"
          id="registerAvatar"
          accept="image/*"
        >

      </div>


      <div class="field">
        <label for="registerEmail">البريد الإلكتروني</label>

        <input
          type="email"
          id="registerEmail"
          placeholder="أدخل بريدك الإلكتروني"
          required
        >
      </div>


      <div class="field">
        <label for="registerPassword">كلمة المرور</label>

        <input
          type="password"
          id="registerPassword"
          placeholder="أدخل كلمة المرور"
          required
          minlength="6"
        >
      </div>


      <div class="field">
        <label for="confirmPassword">تأكيد كلمة المرور</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="أعد كتابة كلمة المرور"
          required
          minlength="6"
        >
      </div>


      <button class="btn" type="submit" id="registerBtn">
        إنشاء الحساب
      </button>

      <div class="message" id="registerMessage"></div>

    </form>


    <a href="index.html" class="back">
      العودة إلى الرئيسية
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    // =========================
    // Firebase
    // =========================

    const firebaseConfig = {
      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",
      authDomain: "noctyra-4b71b.firebaseapp.com",
      projectId: "noctyra-4b71b",
      storageBucket: "noctyra-4b71b.firebasestorage.app",
      messagingSenderId: "240877556023",
      appId: "1:240877556023:web:99529c91607902b8414ab2",
      measurementId: "G-DYP839YDNK"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);
    const db = getFirestore(app);


    // =========================
    // العناصر
    // =========================

    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");

    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");

    const loginMessage = document.getElementById("loginMessage");
    const registerMessage = document.getElementById("registerMessage");

    const loginBtn = document.getElementById("loginBtn");
    const registerBtn = document.getElementById("registerBtn");

    const avatarInput = document.getElementById("registerAvatar");
    const avatarPreview = document.getElementById("avatarPreview");


    // =========================
    // تبديل الصفحات
    // =========================

    loginTab.addEventListener("click", () => {

      loginTab.classList.add("active");
      registerTab.classList.remove("active");

      loginForm.classList.add("active");
      registerForm.classList.remove("active");

      loginMessage.textContent = "";
      registerMessage.textContent = "";
    });


    registerTab.addEventListener("click", () => {

      registerTab.classList.add("active");
      loginTab.classList.remove("active");

      registerForm.classList.add("active");
      loginForm.classList.remove("active");

      loginMessage.textContent = "";
      registerMessage.textContent = "";
    });


    // =========================
    // ضغط الصورة
    // =========================

    function compressImage(file) {

      return new Promise((resolve, reject) => {

        const reader = new FileReader();

        reader.onload = event => {

          const img = new Image();

          img.onload = () => {

            const canvas = document.createElement("canvas");

            const maxSize = 400;

            let width = img.width;
            let height = img.height;

            if (width > height) {

              if (width > maxSize) {
                height *= maxSize / width;
                width = maxSize;
              }

            } else {

              if (height > maxSize) {
                width *= maxSize / height;
                height = maxSize;
              }

            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            resolve(
              canvas.toDataURL(
                "image/jpeg",
                0.75
              )
            );

          };

          img.onerror = reject;

          img.src = event.target.result;

        };

        reader.onerror = reject;

        reader.readAsDataURL(file);

      });

    }


    // =========================
    // اختيار الصورة
    // =========================

    let selectedAvatar = "";


    avatarInput.addEventListener("change", async () => {

      const file = avatarInput.files[0];

      if (!file) return;

      try {

        selectedAvatar = await compressImage(file);

        avatarPreview.src = selectedAvatar;

      } catch (error) {

        selectedAvatar = "";

        registerMessage.textContent =
          "تعذر تحميل الصورة.";

        registerMessage.className =
          "message error";

      }

    });


    // =========================
    // تسجيل الدخول
    // =========================

    loginForm.addEventListener("submit", async event => {

      event.preventDefault();

      loginMessage.textContent = "";
      loginMessage.className = "message";

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      loginBtn.disabled = true;
      loginBtn.textContent = "جاري الدخول...";


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        loginMessage.textContent =
          "تم تسجيل الدخول بنجاح.";

        loginMessage.className =
          "message success";


        setTimeout(() => {
          window.location.href = "index.html";
        }, 500);


      } catch (error) {

        console.error(error);

        let message =
          "حدث خطأ أثناء تسجيل الدخول.";

        if (error.code === "auth/invalid-credential") {
          message =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        }

        if (error.code === "auth/user-not-found") {
          message =
            "لا يوجد حساب بهذا البريد.";
        }

        if (error.code === "auth/wrong-password") {
          message =
            "كلمة المرور غير صحيحة.";
        }

        if (error.code === "auth/invalid-email") {
          message =
            "البريد الإلكتروني غير صحيح.";
        }

        loginMessage.textContent = message;

        loginMessage.className =
          "message error";

      } finally {

        loginBtn.disabled = false;
        loginBtn.textContent = "تسجيل الدخول";

      }

    });


    // =========================
    // إنشاء الحساب
    // =========================

    registerForm.addEventListener("submit", async event => {

      event.preventDefault();

      registerMessage.textContent = "";
      registerMessage.className = "message";


      const email =
        document.getElementById("registerEmail")
          .value
          .trim();

      const password =
        document.getElementById("registerPassword")
          .value;

      const confirmPassword =
        document.getElementById("confirmPassword")
          .value;


      // التحقق من كلمة المرور

      if (password.length < 6) {

        registerMessage.textContent =
          "كلمة المرور لازم تكون 6 أحرف على الأقل.";

        registerMessage.className =
          "message error";

        return;
      }


      if (password !== confirmPassword) {

        registerMessage.textContent =
          "كلمتا المرور غير متطابقتين.";

        registerMessage.className =
          "message error";

        return;
      }


      registerBtn.disabled = true;
      registerBtn.textContent = "جاري إنشاء الحساب...";


      try {

        // إنشاء الحساب في Firebase Authentication

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        // =========================
        // users
        // =========================

        await setDoc(
          doc(db, "users", user.uid),
          {
            uid: user.uid,
            email: user.email,
            avatar: selectedAvatar || "",
            createdAt: Timestamp.now()
          }
        );


        // =========================
        // publicProfiles
        // =========================

        await setDoc(
          doc(db, "publicProfiles", user.uid),
          {
            avatar: selectedAvatar || "",
            bio: "",
            joinedAt: Timestamp.now()
          }
        );


        registerMessage.textContent =
          "تم إنشاء الحساب بنجاح.";

        registerMessage.className =
          "message success";


        setTimeout(() => {
          window.location.href = "index.html";
        }, 700);


      } catch (error) {

        console.error(error);

        let message =
          "حدث خطأ أثناء إنشاء الحساب.";


        if (error.code === "auth/email-already-in-use") {

          message =
            "هذا البريد الإلكتروني مستخدم بالفعل.";

        } else if (error.code === "auth/invalid-email") {

          message =
            "البريد الإلكتروني غير صحيح.";

        } else if (error.code === "auth/weak-password") {

          message =
            "كلمة المرور ضعيفة.";

        } else if (error.code === "auth/network-request-failed") {

          message =
            "تأكد من اتصالك بالإنترنت.";

        }


        registerMessage.textContent = message;

        registerMessage.className =
          "message error";

      } finally {

        registerBtn.disabled = false;
        registerBtn.textContent = "إنشاء الحساب";

      }

    });


    // =========================
    // إذا كان مسجل دخول
    // =========================

    onAuthStateChanged(auth, user => {

      if (user) {

        // ما نسوي إعادة توجيه مباشرة هنا
        // حتى يقدر المستخدم يشوف الصفحة
        // إذا فتحها يدويًا.

      }

    });

  </script>

</body>

</html>
