<script type="module">

  import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
  } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {
    apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",
    authDomain: "noctyra-4b71b.firebaseapp.com",
    projectId: "noctyra-4b71b",
    storageBucket: "noctyra-4b71b.firebasestorage.app",
    messagingSenderId: "240877556023",
    appId: "1:240877556023:web:99529c91607902b8414ab2",
    measurementId: "G-DYP839YDNK"
  };


  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);


  const coverInput =
    document.getElementById("coverInput");

  const coverPreview =
    document.getElementById("coverPreview");

  const coverContent =
    document.getElementById("coverContent");


  coverInput.addEventListener("change", function () {

    const file = this.files[0];

    if (!file) return;

    const imageURL = URL.createObjectURL(file);

    coverPreview.src = imageURL;
    coverPreview.style.display = "block";
    coverContent.style.display = "none";

  });


  document
    .getElementById("submitButton")
    .addEventListener("click", async function () {

      const button = this;

      const name =
        document.getElementById("workName").value.trim();

      const story =
        document.getElementById("story").value.trim();

      const category =
        document.getElementById("category").value;

      const cover =
        document.getElementById("coverInput").files[0];


      if (!cover) {
        alert("أضف صورة العمل أولًا.");
        return;
      }

      if (!name) {
        alert("اكتب اسم العمل.");
        return;
      }

      if (!story) {
        alert("اكتب قصة العمل.");
        return;
      }

      if (!category) {
        alert("اختر تصنيف العمل.");
        return;
      }


      try {

        button.disabled = true;
        button.textContent = "جاري الإرسال...";


        await addDoc(collection(db, "publicationRequests"), {

          name: name,

          story: story,

          category: category,

          imageName: cover.name,

          imageType: cover.type,

          imageSize: cover.size,

          status: "pending",

          createdAt: serverTimestamp()

        });


        alert("تم إرسال طلبك بنجاح ✦");

        document.getElementById("workName").value = "";
        document.getElementById("story").value = "";
        document.getElementById("category").value = "";
        coverInput.value = "";

        coverPreview.src = "";
        coverPreview.style.display = "none";
        coverContent.style.display = "block";


      } catch (error) {

        console.error(error);

        alert(
          "حدث خطأ أثناء إرسال الطلب.\n\n" +
          error.message
        );

      } finally {

        button.disabled = false;
        button.textContent = "إرسال الطلب";

      }

    });

        </script>
