<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حسابي | Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #24113d 0%, #0b0710 45%, #050407 100%);
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(5,4,7,.75);
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    .back {
      color: #c99cff;
      text-decoration: none;
      font-size: 15px;
    }

    main {
      min-height: calc(100vh - 75px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .account-card {
      width: 100%;
      max-width: 500px;
      padding: 35px;
      border-radius: 20px;
      background: rgba(20,14,28,.9);
      border: 1px solid rgba(180,120,255,.18);
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #29153d, #120c18);
      border: 1px solid #6f3d91;
      color: #c99cff;
      font-size: 34px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 25px;
    }

    .info {
      padding: 18px;
      margin-bottom: 20px;
      border-radius: 13px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.07);
    }

    .label {
      display: block;
      color: #9b8ba8;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 16px;
      word-break: break-all;
    }

    .logout {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #6e3b8f;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: .2s;
    }

    .logout:hover {
      background: #8249a5;
    }

    .loading {
      text-align: center;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NOCTYRA</div>
    <a class="back" href="index.html">العودة للرئيسية</a>
  </header>

  <main>

    <div class="account-card" id="accountCard">

      <div class="loading">
        جاري تحميل الحساب...
      </div>

    </div>

  </main>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {

      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

      authDomain: "noctyra-4b71b.firebaseapp.com",

      projectId: "noctyra-4b71b",

      storageBucket: "noctyra-4b71b.firebasestorage.app",

      messagingSenderId: "240877556023",

      appId: "1:240877556023:web:99529c91607902b8414ab2",

      measurementId: "G-DYP839YDNK"

    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const accountCard = document.getElementById("accountCard");


    onAuthStateChanged(auth, (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;

      }


      accountCard.innerHTML = `

        <div class="avatar">N</div>

        <h1>حسابي</h1>

        <div class="info">

          <span class="label">البريد الإلكتروني</span>

          <div class="value">${user.email || "غير متوفر"}</div>

        </div>

        <div class="info">

          <span class="label">حالة الحساب</span>

          <div class="value">مسجل الدخول ✓</div>

        </div>

        <button class="logout" id="logoutBtn">
          تسجيل الخروج
        </button>

      `;


      document
        .getElementById("logoutBtn")
        .addEventListener("click", async () => {

          try {

            await signOut(auth);

            window.location.href = "index.html";

          } catch (error) {

            alert("حدث خطأ أثناء تسجيل الخروج");

          }

        });

    });

  </script>

</body>

</html>
