<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noctyra - تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #24113d 0%, #100817 45%, #07040b 100%);
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: rgba(18, 10, 28, 0.94);
      border: 1px solid rgba(160, 92, 220, 0.35);
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #d8a7ff;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .tab {
      flex: 1;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #21132d;
      color: #aaa;
      cursor: pointer;
      font-size: 15px;
    }

    .tab.active {
      background: #7136a3;
      color: white;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 14px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #3d294c;
      background: #0d0812;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    textarea:focus {
      border-color: #914dcc;
    }

    .avatar-preview {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 10px auto;
      border: 2px solid #7136a3;
      background: #18101f;
    }

    .avatar-label {
      text-align: center;
      display: block;
      padding: 10px;
      background: #21132d;
      border-radius: 10px;
      cursor: pointer;
      color: #d8a7ff;
    }

    #avatarInput {
      display: none;
    }

    .username-status {
      font-size: 12px;
      margin-top: 6px;
      min-height: 16px;
    }

    .button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #7136a3, #9c55d6);
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #b987d9;
      text-decoration: none;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">Noctyra</div>
    <div class="subtitle">مرحباً بك في Noctyra</div>

    <div class="tabs">
      <button class="tab active" id="loginTab">تسجيل الدخول</button>
      <button class="tab" id="registerTab">إنشاء حساب</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm">

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input
          type="email"
          id="loginEmail"
          placeholder="example@email.com"
          required
        >
      </div>

      <div class="field">
        <label>كلمة المرور</label>
        <input
          type="password"
          id="loginPassword"
          placeholder="كلمة المرور"
          required
        >
      </div>

      <button class="button" type="submit">
        تسجيل الدخول
      </button>

    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="hidden">

      <div class="field">
        <label>اسم المستخدم</label>

        <input
          type="text"
          id="registerUsername"
          placeholder="مثال: Naya_01"
          minlength="3"
          maxlength="20"
          required
        >

        <div
          class="username-status"
          id="usernameStatus">
        </div>
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>

        <input
          type="email"
          id="registerEmail"
          placeholder="example@email.com"
          required
        >
      </div>

      <div class="field">
        <label>كلمة المرور</label>

        <input
          type="password"
          id="registerPassword"
          placeholder="6 أحرف على الأقل"
          minlength="6"
          required
        >
      </div>

      <div class="field">
        <label>تأكيد كلمة المرور</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="أعد كتابة كلمة المرور"
          minlength="6"
          required
        >
      </div>

      <div class="field">

        <label>الصورة الشخصية</label>

        <img
          id="avatarPreview"
          class="avatar-preview"
          src=""
          alt="الصورة الشخصية"
        >

        <label
          for="avatarInput"
          class="avatar-label">
          اختيار صورة
        </label>

        <input
          type="file"
          id="avatarInput"
          accept="image/*"
        >

      </div>

      <button
        class="button"
        type="submit"
        id="registerButton">
        إنشاء الحساب
      </button>

    </form>

    <div
      class="message"
      id="message">
    </div>

    <a
      href="index.html"
      class="back">
      العودة للرئيسية
    </a>

  </div>


  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      browserLocalPersistence,
      setPersistence
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      Timestamp
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /* =========================
       FIREBASE
    ========================= */

    const firebaseConfig = {

      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",

      authDomain: "noctyra-4b71b.firebaseapp.com",

      projectId: "noctyra-4b71b",

      storageBucket: "noctyra-4b71b.firebasestorage.app",

      messagingSenderId: "240877556023",

      appId: "1:240877556023:web:99529c91607902b8414ab2",

      measurementId: "G-DYP839YDNK"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* =========================
       حفظ تسجيل الدخول
    ========================= */

    await setPersistence(
      auth,
      browserLocalPersistence
    );


    /* =========================
       ELEMENTS
    ========================= */

    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    const loginForm =
      document.getElementById("loginForm");

    const registerForm =
      document.getElementById("registerForm");

    const message =
      document.getElementById("message");

    const usernameInput =
      document.getElementById("registerUsername");

    const usernameStatus =
      document.getElementById("usernameStatus");

    const avatarInput =
      document.getElementById("avatarInput");

    const avatarPreview =
      document.getElementById("avatarPreview");


    let avatarData = "";

    let usernameAvailable = false;


    /* =========================
       TABS
    ========================= */

    loginTab.addEventListener("click", () => {

      loginTab.classList.add("active");

      registerTab.classList.remove("active");

      loginForm.classList.remove("hidden");

      registerForm.classList.add("hidden");

      message.textContent = "";

    });


    registerTab.addEventListener("click", () => {

      registerTab.classList.add("active");

      loginTab.classList.remove("active");

      registerForm.classList.remove("hidden");

      loginForm.classList.add("hidden");

      message.textContent = "";

    });


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(
      text,
      success = false
    ) {

      message.textContent = text;

      message.style.color =
        success
          ? "#9be69b"
          : "#ff8c8c";
    }


    /* =========================
       USERNAME CHECK
    ========================= */

    usernameInput.addEventListener(
      "input",
      async () => {

        const username =
          usernameInput.value.trim();

        usernameAvailable = false;

        if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {

          usernameStatus.textContent =
            "استخدم 3 إلى 20 حرفاً إنجليزياً أو رقماً أو _";

          usernameStatus.style.color =
            "#ff8c8c";

          return;
        }


        usernameStatus.textContent =
          "جاري التحقق...";

        usernameStatus.style.color =
          "#aaa";


        try {

          const usernameDoc =
            await getDoc(
              doc(
                db,
                "usernames",
                username.toLowerCase()
              )
            );


          if (usernameDoc.exists()) {

            usernameStatus.textContent =
              "اسم المستخدم مستخدم بالفعل";

            usernameStatus.style.color =
              "#ff8c8c";

            usernameAvailable = false;

          } else {

            usernameStatus.textContent =
              "اسم المستخدم متاح ✓";

            usernameStatus.style.color =
              "#9be69b";

            usernameAvailable = true;
          }

        } catch (error) {

          console.error(error);

          usernameStatus.textContent =
            "حدث خطأ أثناء التحقق";

          usernameStatus.style.color =
            "#ff8c8c";

        }

      }
    );


    /* =========================
       AVATAR
    ========================= */

    avatarInput.addEventListener(
      "change",
      () => {

        const file =
          avatarInput.files[0];

        if (!file) return;


        const reader =
          new FileReader();


        reader.onload = event => {

          const image =
            new Image();


          image.onload = () => {

            const maxSize = 400;

            let width =
              image.width;

            let height =
              image.height;


            if (width > height) {

              if (width > maxSize) {

                height =
                  height *
                  maxSize /
                  width;

                width = maxSize;
              }

            } else {

              if (height > maxSize) {

                width =
                  width *
                  maxSize /
                  height;

                height = maxSize;
              }
            }


            const canvas =
              document.createElement("canvas");

            canvas.width = width;

            canvas.height = height;


            const ctx =
              canvas.getContext("2d");


            ctx.drawImage(
              image,
              0,
              0,
              width,
              height
            );


            avatarData =
              canvas.toDataURL(
                "image/jpeg",
                0.75
              );


            avatarPreview.src =
              avatarData;
          };


          image.src =
            event.target.result;
        };


        reader.readAsDataURL(file);

      }
    );


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("loginPassword")
            .value;


        showMessage(
          "جاري تسجيل الدخول...",
          true
        );


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "تم تسجيل الدخول ✓",
            true
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 500);


        } catch (error) {

          console.error(error);

          let text =
            "حدث خطأ أثناء تسجيل الدخول";


          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            text =
              "البريد الإلكتروني أو كلمة المرور غير صحيحة";

          } else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            text =
              "محاولات كثيرة، حاولي لاحقاً";

          }


          showMessage(text);

        }

      }
    );


    /* =========================
       REGISTER
    ========================= */

    registerForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const username =
          usernameInput.value.trim();

        const email =
          document
            .getElementById("registerEmail")
            .value
            .trim();

        const password =
          document
            .getElementById("registerPassword")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        const registerButton =
          document.getElementById(
            "registerButton"
          );


        /* =========================
           CHECK USERNAME
        ========================= */

        if (
          !/^[A-Za-z0-9_]{3,20}$/.test(
            username
          )
        ) {

          showMessage(
            "اسم المستخدم غير صالح"
          );

          return;
        }


        /* =========================
           CHECK PASSWORD
        ========================= */

        if (
          password !==
          confirmPassword
        ) {

          showMessage(
            "كلمتا المرور غير متطابقتين"
          );

          return;
        }


        /* =========================
           CHECK USERNAME AGAIN
        ========================= */

        try {

          const usernameRef =
            doc(
              db,
              "usernames",
              username.toLowerCase()
            );


          const usernameDoc =
            await getDoc(
              usernameRef
            );


          if (usernameDoc.exists()) {

            showMessage(
              "اسم المستخدم مستخدم بالفعل"
            );

            usernameAvailable = false;

            return;
          }


        } catch (error) {

          console.error(error);

          showMessage(
            "تعذر التحقق من اسم المستخدم"
          );

          return;
        }


        registerButton.disabled =
          true;

        registerButton.textContent =
          "جاري إنشاء الحساب...";


        try {

          /* =========================
             CREATE FIREBASE ACCOUNT
          ========================= */

          const credential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            credential.user;


          /* =========================
             FIXED CREATION DATE
             
             هذا هو تاريخ إنشاء الحساب
             الحقيقي من Firebase Auth
             وليس آخر تسجيل دخول.
          ========================= */

          const creationTime =
            user.metadata &&
            user.metadata.creationTime
              ? new Date(
                  user.metadata.creationTime
                )
              : new Date();


          const userCreatedAt =
            Timestamp.fromDate(
              creationTime
            );


          /* =========================
             PRIVATE USER DATA
             
             البريد يبقى هنا فقط
             ولا يظهر للأعضاء.
          ========================= */

          await setDoc(
            doc(
              db,
              "users",
              user.uid
            ),
            {

              uid: user.uid,

              username: username,

              email: user.email,

              avatar:
                avatarData || "",

              createdAt:
                userCreatedAt
            }
          );


          /* =========================
             PUBLIC PROFILE
             
             البيانات التي يمكن للأعضاء
             رؤيتها.
          ========================= */

          await setDoc(
            doc(
              db,
              "publicProfiles",
              user.uid
            ),
            {

              username: username,

              avatar:
                avatarData || "",

              bio: "",

              joinedAt:
                userCreatedAt
            }
          );


          /* =========================
             RESERVE USERNAME
          ========================= */

          await setDoc(
            doc(
              db,
              "usernames",
              username.toLowerCase()
            ),
            {

              uid: user.uid,

              username: username
            }
          );


          /* =========================
             SUCCESS
          ========================= */

          showMessage(
            "تم إنشاء الحساب بنجاح ✓",
            true
          );


          setTimeout(() => {

            window.location.href =
              "index.html";

          }, 800);


        } catch (error) {

          console.error(error);

          let text =
            "حدث خطأ أثناء إنشاء الحساب";


          if (
            error.code ===
            "auth/email-already-in-use"
          ) {

            text =
              "هذا البريد الإلكتروني مستخدم بالفعل";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            text =
              "البريد الإلكتروني غير صالح";

          } else if (
            error.code ===
            "auth/weak-password"
          ) {

            text =
              "كلمة المرور ضعيفة";

          } else if (
            error.code ===
            "permission-denied"
          ) {

            text =
              "لا توجد صلاحية لحفظ بيانات الحساب";

          }


          showMessage(text);


          registerButton.disabled =
            false;

          registerButton.textContent =
            "إنشاء الحساب";

        }

      }
    );

  </script>

</body>

</html>
