<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>حسابي — Noctyra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 50% 30%,
          #21172c 0%,
          #0b0a0e 45%,
          #060608 100%
        );

      color: #eee;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .account-container {
      width: 100%;
      max-width: 450px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 8px;
      margin-bottom: 25px;
    }

    .logo span {
      color: #9b72bd;
    }

    .account-box {
      background: rgba(15, 14, 19, 0.96);
      border: 1px solid #29242f;
      border-radius: 10px;
      padding: 40px 30px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.5);

      text-align: center;
    }

    .icon {
      font-size: 35px;
      color: #9b72bd;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #77727d;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .email-box {
      background: #09090c;
      border: 1px solid #2b2730;
      border-radius: 6px;

      padding: 15px;

      color: #b18bc8;
      font-size: 14px;

      margin-bottom: 20px;

      word-break: break-word;
    }

    button {
      width: 100%;
      padding: 14px;

      background: #eee;
      color: #09090c;

      border: 1px solid #eee;
      border-radius: 6px;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: transparent;
      color: #eee;
    }

    .back {
      display: block;
      margin-top: 25px;

      color: #66616b;
      text-decoration: none;

      font-size: 12px;
    }

    .back:hover {
      color: #9b72bd;
    }
  </style>
</head>

<body>

  <main class="account-container">

    <div class="logo">
      NOCTYRA<span>.</span>
    </div>

    <section class="account-box">

      <div class="icon">
        ✦
      </div>

      <h1>
        حسابي
      </h1>

      <p class="subtitle">
        مرحبًا بك في Noctyra
      </p>

      <div class="email-box" id="userEmail">
        جاري تحميل الحساب...
      </div>

      <button id="logoutButton">
        تسجيل الخروج
      </button>

      <a href="index.html" class="back">
        ← العودة إلى الرئيسية
      </a>

    </section>

  </main>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAvVSfxR6ecsWU2lGUlHDJgdH3hktrZjGY",
      authDomain: "noctyra-4b71b.firebaseapp.com",
      projectId: "noctyra-4b71b",
      storageBucket: "noctyra-4b71b.firebasestorage.app",
      messagingSenderId: "240877556023",
      appId: "1:240877556023:web:99529c91607902b8414ab2",
      measurementId: "G-DYP839YDNK"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const userEmail = document.getElementById("userEmail");

    const logoutButton =
      document.getElementById("logoutButton");


    onAuthStateChanged(auth, (user) => {

      if (user) {

        userEmail.textContent = user.email;

      } else {

        userEmail.textContent =
          "لم يتم تسجيل الدخول.";

        logoutButton.style.display =
          "none";
      }

    });


    logoutButton.addEventListener("click", async () => {

      try {

        await signOut(auth);

        window.location.href = "login.html";

      } catch (error) {

        console.error(error);

        alert("حدث خطأ أثناء تسجيل الخروج.");

      }

    });

  </script>

</body>
</html>
